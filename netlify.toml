[build]
  command = "node scripts/build-static.mjs"
  publish = "dist"

# O diretório publicado já contém dist/Central-de-Controle-/index.html.
# Não reescrever a própria rota canônica para index.html: o Netlify
# canonicaliza /index.html de volta para o diretório e isso pode formar loop.
[[redirects]]
  from = "/"
  to = "/Central-de-Controle-/"
  status = 302
  force = true

[[redirects]]
  from = "/Central-de-Controle-"
  to = "/Central-de-Controle-/"
  status = 302
  force = true

[[headers]]
  for = "/Central-de-Controle-/*.mjs"
  [headers.values]
    Content-Type = "text/javascript; charset=utf-8"

[[headers]]
  for = "/Central-de-Controle-/sw.js"
  [headers.values]
    Cache-Control = "no-cache"

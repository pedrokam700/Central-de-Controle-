[build]
  command = "node scripts/build-static.mjs"
  publish = "dist"

# Evita qualquer canonicalização/redirect HTTP do próprio Netlify no preview.
# O build publica dist/index.html (entrada raiz estática) e
# dist/Central-de-Controle-/index.html (Central real).
[build.processing.html]
  pretty_urls = false

# Baseline de segurança que não interfere com Firebase/CORA/agente local.
# CSP bloqueante fica para uma wave separada depois do inventário de scripts/origens.
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "no-referrer"
    Permissions-Policy = "geolocation=(), payment=(), usb=(), serial=()"

[[headers]]
  for = "/Central-de-Controle-/*.mjs"
  [headers.values]
    Content-Type = "text/javascript; charset=utf-8"

[[headers]]
  for = "/Central-de-Controle-/sw.js"
  [headers.values]
    Cache-Control = "no-cache"

# Identidade de release nunca pode ficar presa em cache e mascarar SHA antigo.
[[headers]]
  for = "/release-build.json"
  [headers.values]
    Cache-Control = "no-store, max-age=0"

[[headers]]
  for = "/release-identity.json"
  [headers.values]
    Cache-Control = "no-store, max-age=0"

[[headers]]
  for = "/Central-de-Controle-/release-identity.json"
  [headers.values]
    Cache-Control = "no-store, max-age=0"

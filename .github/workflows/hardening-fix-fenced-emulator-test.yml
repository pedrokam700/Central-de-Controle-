name: One-shot fenced emulator test fix

on:
  push:
    branches:
      - hardening/p0-production-readiness
    paths:
      - '.github/workflows/hardening-fix-fenced-emulator-test.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Apply exact harness fix
        run: node scripts/hardening-fix-fenced-emulator-test.mjs
      - name: Validate patched test source
        run: |
          node --check scripts/ames-rules.emulator.mjs
          ! grep -q 'collector_fence:undefined' scripts/ames-rules.emulator.mjs
          grep -Fq 'const {collector_fence:ignoredFence,...unfencedHead}=fencedHead2;' scripts/ames-rules.emulator.mjs
      - name: Remove one-shot tooling
        run: rm scripts/hardening-fix-fenced-emulator-test.mjs .github/workflows/hardening-fix-fenced-emulator-test.yml
      - name: Commit only validated harness fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts/ames-rules.emulator.mjs scripts/hardening-fix-fenced-emulator-test.mjs .github/workflows/hardening-fix-fenced-emulator-test.yml
          git diff --cached --quiet && { echo 'No validated change to commit'; exit 1; }
          git commit -m 'Test: remove SDK-invalid fenced downgrade assertion'
          git push origin HEAD:hardening/p0-production-readiness

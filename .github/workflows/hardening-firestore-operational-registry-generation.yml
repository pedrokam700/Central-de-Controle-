name: One-shot generated Firestore operational registry patch

on:
  push:
    branches:
      - hardening/p0-production-readiness
    paths:
      - .github/workflows/hardening-firestore-operational-registry-generation.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact hardening head
        uses: actions/checkout@v7
        with:
          ref: hardening/p0-production-readiness
          fetch-depth: 0
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Refuse moved branch
        run: test "$(git rev-parse HEAD)" = "$GITHUB_SHA" || { echo "Branch moved; fail closed."; exit 1; }
      - name: Apply exact registry generation patch
        run: node scripts/apply-firestore-operational-registry-generation-patch.mjs
      - name: Validate generated Rules registry
        run: |
          node scripts/firestore-operational-registry.mjs --check
          node --test scripts/ames-operational-registry.test.mjs scripts/ames-firestore-operational-registry-generation.test.mjs
          git diff --check -- firestore.rules scripts/firestore-operational-registry.mjs scripts/ames-firestore-operational-registry-generation.test.mjs
      - name: Commit generated registry and remove one-shot machinery
        run: |
          rm .github/workflows/hardening-firestore-operational-registry-generation.yml
          rm scripts/apply-firestore-operational-registry-generation-patch.mjs
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add firestore.rules scripts/firestore-operational-registry.mjs scripts/ames-firestore-operational-registry-generation.test.mjs .github/workflows/hardening-firestore-operational-registry-generation.yml scripts/apply-firestore-operational-registry-generation-patch.mjs
          git diff --cached --check
          git commit -m "Hardening: generate Firestore MES lines from operational registry"
          git push origin HEAD:hardening/p0-production-readiness

name: One-shot offline readiness precache closure

on:
  push:
    branches:
      - hardening/p0-production-readiness
    paths:
      - '.github/workflows/hardening-patch-offline-readiness-precache.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Apply exact service-worker precache patch
        run: node scripts/hardening-patch-offline-readiness-precache.mjs
      - name: Validate dependency closure
        run: |
          node --check sw.js
          grep -Fq "BASE+'core/offline-readiness.mjs'" sw.js
          grep -Fq "BASE+'core/firebase-sdk-preparation.mjs'" sw.js
          grep -Fq "'https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js'" sw.js
          grep -Fq "'https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js'" sw.js
          grep -Fq "'https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js'" sw.js
      - name: Remove one-shot tooling
        run: rm scripts/hardening-patch-offline-readiness-precache.mjs .github/workflows/hardening-patch-offline-readiness-precache.yml
      - name: Commit validated precache closure
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add sw.js scripts/hardening-patch-offline-readiness-precache.mjs .github/workflows/hardening-patch-offline-readiness-precache.yml
          git diff --cached --quiet && { echo 'No validated change to commit'; exit 1; }
          git commit -m 'Hardening: close offline readiness precache dependencies'
          git push origin HEAD:hardening/p0-production-readiness

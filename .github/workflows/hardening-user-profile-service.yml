name: One-shot user profile service extraction

on:
  push:
    branches:
      - hardening/p0-production-readiness
    paths:
      - .github/workflows/hardening-user-profile-service.yml

permissions:
  contents: write

jobs:
  extract-and-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Verify exact branch head
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin hardening/p0-production-readiness
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git rev-parse origin/hardening/p0-production-readiness)" = "$GITHUB_SHA"
      - name: Extract user profile service from app.js
        run: node scripts/patch-user-profile-service.mjs
      - name: Validate user profile service and admission behavior
        shell: bash
        run: |
          set -euo pipefail
          node --check app.js
          node --test \
            scripts/ames-user-profile-service.test.mjs \
            scripts/ames-session-admission.test.mjs \
            scripts/ames-session-admission-app.test.mjs \
            scripts/ames-firestore-guarded-client.test.mjs \
            scripts/ames-capability-write-ui.test.mjs \
            scripts/ames-admission-admin-app.test.mjs \
            scripts/ames-cache.test.mjs \
            scripts/ames-release-build.test.mjs
          git diff --check
      - name: Remove one-shot write tooling
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/hardening-user-profile-service.yml
          rm -f scripts/patch-user-profile-service.mjs
          git diff --check
      - name: Commit extraction only after focused validation
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin hardening/p0-production-readiness
          test "$(git rev-parse origin/hardening/p0-production-readiness)" = "$GITHUB_SHA"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && { echo "No user profile extraction changes"; exit 1; }
          git commit -m "Hardening: extract user profile service from app"
          git push origin HEAD:hardening/p0-production-readiness

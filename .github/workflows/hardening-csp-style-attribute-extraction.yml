# retry after separating style-block and style-attribute metadata
name: One-shot CSP style-attribute extraction

on:
  push:
    branches:
      - hardening/p0-production-readiness
    paths:
      - .github/workflows/hardening-csp-style-attribute-extraction.yml

permissions:
  contents: write

jobs:
  extract-and-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Verify exact branch head
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin hardening/p0-production-readiness
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git rev-parse origin/hardening/p0-production-readiness)" = "$GITHUB_SHA"
      - name: Externalize static style attributes
        run: node scripts/run-csp-style-attribute-extraction-once.mjs
      - name: Validate CSP attribute extraction
        shell: bash
        run: |
          set -euo pipefail
          exec > >(tee csp-attribute-validation.log) 2>&1
          python3 -m pip install openpyxl==3.1.5
          git diff --check
          node --test \
            scripts/ames-csp-style-attributes.test.mjs \
            scripts/ames-csp-inventory.test.mjs \
            scripts/ames-csp-script-extraction.test.mjs \
            scripts/ames-csp-style-extraction.test.mjs \
            scripts/ames-cache.test.mjs \
            scripts/ames-release-build.test.mjs \
            scripts/release-contract.test.mjs
          PYTHON_BIN=python3 node scripts/quality-gate.mjs
      - name: Upload validation diagnostic
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: csp-style-attribute-validation-${{ github.sha }}
          path: csp-attribute-validation.log
          if-no-files-found: warn
          retention-days: 1
      - name: Remove temporary analysis and write tooling
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/hardening-csp-inventory-snapshot.yml
          rm -f .github/workflows/hardening-csp-style-attribute-extraction.yml
          rm -f scripts/patch-csp-style-attributes.mjs
          rm -f scripts/run-csp-style-attribute-extraction-once.mjs
          git diff --check
      - name: Commit only after validation
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin hardening/p0-production-readiness
          test "$(git rev-parse origin/hardening/p0-production-readiness)" = "$GITHUB_SHA"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && { echo "No CSP style-attribute changes to commit"; exit 1; }
          git commit -m "Hardening: externalize inline style attributes"
          git push origin HEAD:hardening/p0-production-readiness

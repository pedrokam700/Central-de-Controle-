name: One-shot local Service Worker HTTP proof

on:
  push:
    branches:
      - hardening/p0-production-readiness
    paths:
      - '.github/workflows/hardening-patch-local-sw-http-proof.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1
      - name: Apply exact local Service Worker HTTP proof patch
        run: python3 scripts/hardening-patch-local-sw-http-proof.py
      - name: Validate patched Python test
        run: |
          python3 -m py_compile scripts/agent-local-frontend-server.test.py
          grep -Fq '(canonical / "sw.js").write_text' scripts/agent-local-frontend-server.test.py
          grep -Fq '/Central-de-Controle-/sw.js' scripts/agent-local-frontend-server.test.py
      - name: Remove one-shot tooling
        run: rm scripts/hardening-patch-local-sw-http-proof.py .github/workflows/hardening-patch-local-sw-http-proof.yml
      - name: Commit validated HTTP proof
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts/agent-local-frontend-server.test.py scripts/hardening-patch-local-sw-http-proof.py .github/workflows/hardening-patch-local-sw-http-proof.yml
          git diff --cached --quiet && { echo 'No validated change to commit'; exit 1; }
          git commit -m 'Test: prove local Service Worker over loopback HTTP'
          git push origin HEAD:hardening/p0-production-readiness

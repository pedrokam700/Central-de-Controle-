name: Admin Dashboard Patch Once

on:
  push:
    branches:
      - work/ames-operator-ux-parity-20261014
    paths:
      - .github/workflows/admin-dashboard-patch-once.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact event SHA
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Apply guarded dashboard integration
        run: node scripts/apply-daily-admin-dashboard-integration.mjs
      - name: Commit integration
        shell: bash
        run: |
          if git diff --quiet -- app.js sw.js; then
            echo "No integration changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.js sw.js
          git commit -m "feat(admin): integrate operational insight dashboard"
          git push origin HEAD:refs/heads/work/ames-operator-ux-parity-20261014

name: One-shot CSP inline blocker detail

on:
  push:
    branches:
      - hardening/p0-production-readiness
    paths:
      - .github/workflows/hardening-csp-inline-detail.yml

permissions:
  contents: write

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact hardening head
        uses: actions/checkout@v7
        with:
          ref: hardening/p0-production-readiness
          fetch-depth: 0
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Refuse moved branch
        run: test "$(git rev-parse HEAD)" = "$GITHUB_SHA" || { echo "Branch moved; fail closed."; exit 1; }
      - name: Capture inline blocker details
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import crypto from 'node:crypto';
          const html=fs.readFileSync('index.html','utf8');
          const lineAt=index=>html.slice(0,index).split('\n').length;
          const digest=text=>crypto.createHash('sha256').update(text).digest('hex');
          const summarize=(kind,re)=>[...html.matchAll(re)].map((m,i)=>({
            index:i+1,
            line:lineAt(m.index),
            attrs:(m[1]||'').trim(),
            bytes:Buffer.byteLength(m[2]||'','utf8'),
            sha256:digest(m[2]||''),
            preview:String(m[2]||'').trim().replace(/\s+/g,' ').slice(0,180),
            before:html.slice(Math.max(0,m.index-120),m.index).replace(/\s+/g,' ').slice(-120),
            after:html.slice(m.index+m[0].length,m.index+m[0].length+120).replace(/\s+/g,' ').slice(0,120)
          }));
          const styles=summarize('style',/<style\b([^>]*)>([\s\S]*?)<\/style>/gi);
          const scripts=summarize('script',/<script\b([^>]*)>([\s\S]*?)<\/script>/gi).filter(x=>!/(?:^|\s)src\s*=/.test(x.attrs));
          fs.writeFileSync('hardening/csp-inline-detail.json',JSON.stringify({schema:'central-csp-inline-detail-v1',styles,scripts},null,2)+'\n');
          if(styles.length!==15||scripts.length!==1)throw new Error(`Expected 15 inline styles and 1 inline script, got ${styles.length}/${scripts.length}`);
          NODE
          node --test scripts/ames-csp-inventory.test.mjs
          git diff --check -- hardening/csp-inline-detail.json
      - name: Commit detail and remove one-shot workflow
        run: |
          rm .github/workflows/hardening-csp-inline-detail.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add hardening/csp-inline-detail.json .github/workflows/hardening-csp-inline-detail.yml
          git diff --cached --check
          git commit -m "Hardening: record inline CSP blocker details"
          git push origin HEAD:hardening/p0-production-readiness

name: One-shot CSP readiness reconciliation

on:
  push:
    branches:
      - hardening/p0-production-readiness
    paths:
      - .github/workflows/hardening-csp-readiness-reconcile.yml

permissions:
  contents: write

jobs:
  reconcile:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Verify exact branch head
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin hardening/p0-production-readiness
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git rev-parse origin/hardening/p0-production-readiness)" = "$GITHUB_SHA"
      - name: Reconcile CSP evidence and readiness
        run: node scripts/reconcile-csp-readiness.mjs
      - name: Validate readiness remains fail-closed
        shell: bash
        run: |
          set -euo pipefail
          node --test \
            scripts/ames-production-readiness.test.mjs \
            scripts/ames-csp-inventory.test.mjs \
            scripts/ames-csp-style-extraction.test.mjs \
            scripts/ames-csp-style-attributes.test.mjs
          node - <<'NODE'
          const fs=require('fs');
          const r=JSON.parse(fs.readFileSync('hardening/production-readiness.json','utf8'));
          if(r.promotion.stable_allowed||r.promotion.main_merge_allowed||r.promotion.production_rules_publish_allowed)throw new Error('promotion flags changed');
          if(r.gates.csp_inventory.status==='green')throw new Error('CSP cannot be fully GREEN before report-only/external proof');
          if(!String(r.gates.csp_inventory.status).includes('pending'))throw new Error('CSP status must keep policy pending explicit');
          NODE
          git diff --check
      - name: Remove one-shot tooling
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/hardening-csp-readiness-reconcile.yml
          rm -f scripts/reconcile-csp-readiness.mjs
          git diff --check
      - name: Commit reconciled readiness
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin hardening/p0-production-readiness
          test "$(git rev-parse origin/hardening/p0-production-readiness)" = "$GITHUB_SHA"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && { echo "No CSP readiness changes to commit"; exit 1; }
          git commit -m "Hardening: reconcile CSP source readiness"
          git push origin HEAD:hardening/p0-production-readiness

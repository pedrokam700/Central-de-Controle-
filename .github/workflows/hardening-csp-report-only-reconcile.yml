name: One-shot CSP report-only readiness reconciliation

on:
  push:
    branches:
      - hardening/p0-production-readiness
    paths:
      - .github/workflows/hardening-csp-report-only-reconcile.yml

permissions:
  contents: write

jobs:
  reconcile:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Verify exact branch head
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin hardening/p0-production-readiness
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git rev-parse origin/hardening/p0-production-readiness)" = "$GITHUB_SHA"
      - name: Reconcile report-only readiness
        run: node scripts/reconcile-csp-report-only-readiness.mjs
      - name: Validate fail-closed readiness and CSP contracts
        shell: bash
        run: |
          set -euo pipefail
          node --test scripts/ames-production-readiness.test.mjs scripts/ames-csp-report-only.test.mjs
          node - <<'NODE'
          const fs=require('fs');
          const r=JSON.parse(fs.readFileSync('hardening/production-readiness.json','utf8'));
          const g=r.gates.csp_inventory;
          if(!String(g.status).includes('pending'))throw new Error('CSP status lost pending external observation');
          if(r.promotion.stable_allowed||r.promotion.main_merge_allowed||r.promotion.production_rules_publish_allowed)throw new Error('promotion relaxed');
          if(!g.remaining.some(x=>/no open pr|sem.*pr|open pr/i.test(x)))throw new Error('missing explicit no-PR blocker');
          NODE
          git diff --check
      - name: Remove one-shot tooling
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/hardening-csp-report-only-reconcile.yml
          rm -f scripts/reconcile-csp-report-only-readiness.mjs
          git diff --check
      - name: Commit reconciled readiness
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin hardening/p0-production-readiness
          test "$(git rev-parse origin/hardening/p0-production-readiness)" = "$GITHUB_SHA"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && { echo "No CSP report-only readiness changes"; exit 1; }
          git commit -m "Hardening: reconcile CSP report-only readiness"
          git push origin HEAD:hardening/p0-production-readiness

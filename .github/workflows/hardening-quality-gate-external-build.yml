name: One-shot quality gate external BUILD authority patch

on:
  push:
    branches:
      - hardening/p0-production-readiness
    paths:
      - .github/workflows/hardening-quality-gate-external-build.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact hardening head
        uses: actions/checkout@v7
        with:
          ref: hardening/p0-production-readiness
          fetch-depth: 0
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Refuse moved branch
        run: test "$(git rev-parse HEAD)" = "$GITHUB_SHA" || { echo "Branch moved; fail closed."; exit 1; }
      - name: Apply exact quality gate patch
        run: node scripts/apply-quality-gate-external-build-patch.mjs
      - name: Validate quality gate and CSP contracts
        run: |
          node scripts/quality-gate.mjs
          node --test scripts/release-contract.test.mjs scripts/ames-deploy-routing.test.mjs scripts/ames-offline-central.test.mjs scripts/ames-csp-inventory.test.mjs scripts/ames-csp-script-extraction.test.mjs
          git diff --check -- scripts/quality-gate.mjs
      - name: Commit quality gate fix and remove one-shot machinery
        run: |
          rm .github/workflows/hardening-quality-gate-external-build.yml
          rm scripts/apply-quality-gate-external-build-patch.mjs
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/quality-gate.mjs .github/workflows/hardening-quality-gate-external-build.yml scripts/apply-quality-gate-external-build-patch.mjs
          git diff --cached --check
          git commit -m "Hardening: align quality gate with external BUILD authority"
          git push origin HEAD:hardening/p0-production-readiness

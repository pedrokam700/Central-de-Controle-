name: One-shot CORA aiPostJSON destination boundary

on:
  push:
    branches:
      - hardening/p0-production-readiness
    paths:
      - .github/workflows/hardening-cora-network-boundary-app.yml

permissions:
  contents: write

jobs:
  patch-and-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Verify exact branch head
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin hardening/p0-production-readiness
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git rev-parse origin/hardening/p0-production-readiness)" = "$GITHUB_SHA"
      - name: Patch aiPostJSON through destination boundary
        run: node scripts/patch-cora-network-boundary-app.mjs
      - name: Validate focused runtime boundary
        shell: bash
        run: |
          set -euo pipefail
          node --check app.js
          node --test \
            scripts/ames-cora-network-boundary.test.mjs \
            scripts/ames-cora-network-boundary-app.test.mjs \
            scripts/ames-cora-egress-transport.test.mjs \
            scripts/ames-cora-egress-policy.test.mjs \
            scripts/ames-cache.test.mjs \
            scripts/ames-release-build.test.mjs
          git diff --check
      - name: Remove one-shot write tooling
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/hardening-cora-network-boundary-app.yml
          rm -f scripts/patch-cora-network-boundary-app.mjs
          git diff --check
      - name: Commit only after focused validation
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin hardening/p0-production-readiness
          test "$(git rev-parse origin/hardening/p0-production-readiness)" = "$GITHUB_SHA"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && { echo "No CORA network boundary app changes"; exit 1; }
          git commit -m "Hardening: guard CORA aiPostJSON destination"
          git push origin HEAD:hardening/p0-production-readiness

# retry after structural test-harness fix
name: One-shot CSP style extraction

on:
  push:
    branches:
      - hardening/p0-production-readiness
    paths:
      - .github/workflows/hardening-csp-style-extraction.yml

permissions:
  contents: write

jobs:
  extract-and-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact triggering SHA
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Verify exact branch head before patch
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          git fetch origin hardening/p0-production-readiness
          test "$(git rev-parse origin/hardening/p0-production-readiness)" = "$GITHUB_SHA"

      - name: Extract inline style blocks preserving cascade order
        run: node scripts/run-csp-style-extraction-once.mjs

      - name: Validate CSP extraction and dependent contracts
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          node --test \
            scripts/ames-csp-inventory.test.mjs \
            scripts/ames-csp-script-extraction.test.mjs \
            scripts/ames-csp-style-extraction.test.mjs \
            scripts/ames-cache.test.mjs \
            scripts/ames-release-build.test.mjs \
            scripts/release-contract.test.mjs

      - name: Remove one-shot write tooling
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/hardening-csp-style-extraction.yml
          rm -f scripts/patch-csp-style-extraction.mjs
          rm -f scripts/run-csp-style-extraction-once.mjs
          git diff --check

      - name: Commit only after focused validation
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin hardening/p0-production-readiness
          test "$(git rev-parse origin/hardening/p0-production-readiness)" = "$GITHUB_SHA"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && { echo "No CSP extraction changes to commit"; exit 1; }
          git commit -m "Hardening: externalize inline CSP styles"
          git push origin HEAD:hardening/p0-production-readiness

name: A-MES PR76 Cross Module Validation (no installer)

on:
  push:
    branches:
      - work/ames-pr76-cross-integration-20261116
      - work/ames-pr77-3022-checkpoint-proof-20261116
      - work/ames-pr78-names-provenance-20261116
      - work/ames-pr79-observability-gate-20261116
      - work/ames-pr80-reuse-2114-history-parity-20261116
      - work/ames-pr81-mes-navigation-readiness-20261116
      - work/ames-pr82-production-scope-isolation-20261116
      - work/ames-pr83-cdp-home-recovery-20261116
      - work/ames-pr84-3022-extjs-preflight-20261116
      - work/ames-issue85-reuse-event-timeline-20261116
      - work/ames-3074-physical-use-audit-20261116
      - work/ames-3022-production-time-audit-20261117
  workflow_dispatch:

permissions:
  contents: read

jobs:
  local-contracts:
    name: 3022, identity, SQLite and Console contracts
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Install disposable parser test dependencies
        run: python3 -m pip install openpyxl==3.1.5 pandas==2.2.3
      - name: 3022 production time proof matrix (disposable SQLite)
        run: python3 scripts/agent-3022-production-evidence.test.py
      - name: 3074 physical proof matrix (disposable SQLite)
        run: |
          python3 scripts/agent-3074-physical-classification.test.py
          python3 scripts/agent-integrated-snapshot-history.test.py
          python3 scripts/agent-material-3074-link.test.py
          python3 scripts/agent-canonical.test.py
          python3 scripts/agent-canonical-insight-retry.test.py
      - name: 3074 pagination, multi-cycle, raw revisions and state preservation
        run: |
          for suite in agent-deep-3074-page agent-3074-coverage-summary agent-multi-cycle-3028-3074 agent-3074-grid-lifecycle agent-individual-assembly agent-assembly-scope agent-3074-uncertain-reuse agent-history-restore agent-local-history agent-raw-history agent-3074-projection-audit agent-3074-pagination agent-saved-sn-history ames-pr70-state-transfer; do
            python3 "scripts/$suite.test.py" || exit 1
          done
      - name: Local confirmed and mixed replay
        run: |
          python3 scripts/agent-3022-local-replay.test.py
          python3 scripts/agent-3022-mixed-replay.test.py
          python3 scripts/agent-3022-checkpoint-proof.test.py
          python3 scripts/audit/codex_recovery_names_red.py IndependentRecoveryNames.test_R3_complete_label_without_3022_query_proof_does_not_skip_capture
      - name: Historical names, proven source and negative cases
        run: |
          python3 scripts/agent-local-sn-operator-evidence.test.py
          python3 scripts/audit/codex_recovery_names_red.py IndependentRecoveryNames.test_N4_saved_non_END_LOT_operator_reaches_local_SN_cache
      - name: Missing 3022 input now stops after two attempts
        run: python3 scripts/audit/codex_recovery_names_red.py IndependentRecoveryNames.test_R2_missing_extjs_input_stops_after_two_recoverable_failures
      - name: Preserve factory engine and raw capture/recovery contracts
        env:
          PYTHONPATH: ames/factory-engine
        run: |
          python3 -m unittest discover -s ames/factory-engine/tests -p 'test_*.py' -q
          python3 scripts/agent-source-capture.test.py
          python3 scripts/agent-trace-target.test.py
          python3 scripts/agent-trace-auto-resume.test.py
          python3 scripts/agent-sn-3012-fallback.test.py
      - name: F2 3022 strict Home and ExtJS preflight
        run: python3 scripts/agent-3022-real-view-preflight.test.py
      - name: F1 existing OPC/CDP session Home recovery safety
        run: python3 scripts/agent-home-cdp-recovery.test.py
      - name: A-MES navigation route, visibility and OPC readiness
        run: python3 scripts/agent-navigation-readiness.test.py
      - name: Full 3022 observability, single-click, stale-grid and storm-breaker regressions
        env:
          PYTHONPATH: ames/factory-engine
        run: python3 scripts/agent-3022-observability.test.py
      - name: All Central Node contracts across nine views
        run: node --test --test-isolation=none $(find scripts -maxdepth 1 -type f -name 'ames-*.test.mjs' ! -name 'ames-auth-hardening.test.mjs' ! -name 'ames-agent-pairing.test.mjs' | sort)
      - name: U1 single 2114 history without losing original fields
        run: node --test --test-name-pattern='U1' scripts/audit/codex_cross_contracts_red.mjs
      - name: Independent N1/N3 name and source contracts
        run: |
          node --test --test-name-pattern='N1|N2|N3' scripts/audit/codex_cross_contracts_red.mjs
          node --test scripts/ames-name-consistency.test.mjs
      - name: S1 source, line, snapshot, revision and period isolation
        run: |
          node --test --test-name-pattern='S1' scripts/audit/codex_cross_contracts_red.mjs
          node --test scripts/ames-production-scope-isolation.test.mjs
      - name: Pairing and authentication unaffected
        run: |
          node --test scripts/ames-auth-hardening.test.mjs
          node --test scripts/ames-agent-pairing.test.mjs

  visual-smoke:
    name: Nine views browser regression
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Install isolated browser test tools
        run: |
          python3 -m pip install openpyxl==3.1.5 pandas==2.2.3
          npm install --prefix "$RUNNER_TEMP/console-tests" playwright@1.62.1
          "$RUNNER_TEMP/console-tests/node_modules/.bin/playwright" install --with-deps chromium
      - name: Verify all Console views and sync reload
        run: |
          export PLAYWRIGHT_MODULE="$RUNNER_TEMP/console-tests/node_modules/playwright/index.mjs"
          export BROWSER_OUTPUT="$RUNNER_TEMP/console-evidence"
          node scripts/ames-experience.browser.mjs
          node scripts/ames-reuse-timeline.browser.mjs
          node scripts/ames-3074-physical-classification.browser.mjs
          node scripts/ames-sync-reload.browser.mjs
          node scripts/ames-pairing.browser.mjs
          node scripts/ames-3028-completion.browser.mjs

      - name: Preserve synthetic browser evidence (screenshots only)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ames-3074-browser-${{ github.sha }}
          path: ${{ runner.temp }}/console-evidence/*.png
          if-no-files-found: ignore
          retention-days: 7

# No build, merge, deployment, factory CDP, network MES, or installer.
# The only artifact is synthetic browser screenshots; no operational data.

name: A-MES Integrated Candidate Gate

on:
  push:
    branches:
      - work/ames-integrated-clean-v5-20261013
      - work/ames-integrated-clean-v5-improvements-20261013
  workflow_dispatch:

permissions:
  contents: read

jobs:
  integrated-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Compile local agent
        run: python -m compileall -q ames/agent ames/factory-engine

      - name: Protect validated base agent
        run: |
          test "$(git hash-object ames/agent/agent.py)" = "193b2701ec34cdb1c2ff045f0a033755f1c9792a"

      - name: Integrated Python contracts
        run: |
          python scripts/agent-integrated-v5.test.py
          python scripts/agent-operational-calendar.test.py
          python scripts/agent-base-paging.test.py
          python scripts/agent-performance-indexes.test.py
          python scripts/agent-package-contract.test.py
          python scripts/agent-candidate-config.test.py
          PYTHONPATH=ames/agent python - <<'PY'
          import candidate_config
          assert candidate_config.normalize_start_date('2026-01-01') == '2026-01-01'
          try:
              candidate_config.normalize_start_date('not-a-date')
          except ValueError:
              pass
          else:
              raise AssertionError('invalid AMES start date was accepted')
          print('candidate config contract OK')
          PY

      - name: Integrated JS contracts
        run: |
          node --test scripts/ames-integrated-v5.test.mjs scripts/ames-daily-failure-analytics.test.mjs scripts/ames-agent-diagnostics.test.mjs scripts/ames-workstation-bootstrap.test.mjs
          node --test scripts/ames-base-view-performance.test.mjs scripts/ames-runtime-observability.test.mjs scripts/ames-advanced-table.test.mjs

      - name: Check console module syntax
        run: |
          node --check ames/console-view.mjs
          node --check ames/console-legacy-parity.mjs
          node --check ames/console-specialized-views.mjs
          node --check ames/console-wave3-views.mjs
          node --check ames/console-base-view.mjs
          node --check ames/console-data-health.mjs
          node --check ames/console-shift-summary.mjs
          node --check ames/console-evidence-drawer.mjs
          node --check ames/console-monitor-runtime.mjs
          node --check ames/agent-diagnostics.mjs
          node --check ames/base-paging.mjs
          node --check ames/daily-failure-summary.mjs
          node --check ames/daily-failure-analytics.mjs
          node --check ames/console-3012-fastlane.mjs
          node --check ames/data/reuse-analysis.mjs
          node --check ames/reuse-table-view.mjs
          node --check ames/advanced-table.mjs

      - name: Verify frozen 3028 hashes
        run: |
          python - <<'PY'
          from pathlib import Path
          import hashlib
          expected={
            'ames/agent/ames_3028.py':'829da91ba7b685f4594bae2aad737f1eea64d7b1eaa8073e8bb263748fbe1ca1',
            'ames/agent/ames_3028_live.py':'b512d42ad39fad326252264ce57f98f3731db5161ab8625cf5b244dffffad0e2',
          }
          for path,want in expected.items():
              got=hashlib.sha256(Path(path).read_bytes()).hexdigest()
              print(path, got)
              if got!=want:
                  raise SystemExit(f'FROZEN 3028 HASH MISMATCH: {path}')
          PY

      - name: Assert historical 3012 configuration
        run: |
          grep -q '"ames_start_date": "2026-01-01"' ames/agent/config.example.json
          grep -q 'exact_sn_cache' ames/agent/agent_3012_patch.py
          grep -q 'repair_coverage_3012' ames/agent/repair_3012.py

      - name: Build standalone clean integrated candidate
        run: |
          python scripts/build-integrated-candidate.py "$RUNNER_TEMP/central-ames-integrated.zip"
          python - <<'PY'
          import json, os, zipfile
          from pathlib import Path
          z=Path(os.environ['RUNNER_TEMP'])/'central-ames-integrated.zip'
          with zipfile.ZipFile(z) as f:
              names=set(f.namelist())
              required={'00_INICIAR_AQUI.bat','01_INSTALAR_UMA_VEZ.bat','START_LOCAL_CANDIDATE.ps1','01_TROCAR_PARA_PR69_NOVA.bat','TROCAR_PARA_PR69_NOVA.ps1','08_PREPARAR_REDE_AMES.bat','INSTRUCOES_INSTALACAO_LIMPA.txt','MANUAL_LOGICA_CAPTURA_E_CRUZAMENTO.md','NOTAS_ALERTAS_SN_PR69.md','NOTAS_CORRECOES_28OUT_RESTAURACAO.md','NOTAS_VALIDACAO_FPY_TOP3_RASTREABILIDADE.md','ames-agent/config.example.json','ames-agent/agent_hardened_entry.py','ames-agent/base_paging_backend.py','ames-agent/performance_indexes.py','frontend/Central-de-Controle-/index.html','frontend/Central-de-Controle-/ames/console-base-view.mjs','frontend/Central-de-Controle-/ames/console-data-health.mjs','frontend/Central-de-Controle-/ames/console-shift-summary.mjs','frontend/Central-de-Controle-/ames/console-evidence-drawer.mjs','frontend/Central-de-Controle-/ames/agent-diagnostics.mjs','CANDIDATE_MANIFEST.json'}
              missing=required-names
              assert not missing, f'missing clean bundle files: {missing}'
              assert 'ames-agent/config.json' not in names
              assert not any(n.startswith('ames-agent/data/') for n in names)
              assert not any(n.startswith('ATUALIZAR_') or n.startswith('RESTAURAR_') for n in names)
              manifest=json.loads(f.read('CANDIDATE_MANIFEST.json'))
              assert manifest['standalone_clean'] is True
              assert manifest['physical_gate']=='PENDING'
          print('standalone clean ZIP contract OK')
          PY

      - name: Upload integrated candidate
        uses: actions/upload-artifact@v4
        with:
          name: central-ames-integrated-${{ github.sha }}
          path: ${{ runner.temp }}/central-ames-integrated.zip
          if-no-files-found: error
          retention-days: 7

  windows-clean-artifact:
    needs: integrated-contract
    runs-on: windows-latest
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: central-ames-integrated-${{ github.sha }}
          path: artifact
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Extract exact uploaded artifact
        shell: powershell
        run: |
          $zip=(Get-ChildItem artifact -Filter '*.zip' | Select-Object -First 1).FullName
          if(-not $zip){throw 'Integrated ZIP artifact not found'}
          Expand-Archive -LiteralPath $zip -DestinationPath package -Force
          if(-not (Test-Path 'package\ames-agent\config.example.json')){throw 'config.example.json missing from exact artifact'}
          if(Test-Path 'package\ames-agent\config.json'){throw 'Clean artifact must not contain workstation config.json'}
          if(Test-Path 'package\ames-agent\data\ames_local.sqlite3'){throw 'Clean artifact must not contain operational SQLite'}

      - name: Parse Windows launchers from exact artifact
        shell: powershell
        run: |
          foreach($file in @('package\START_LOCAL_CANDIDATE.ps1','package\TROCAR_PARA_PR69_NOVA.ps1','package\suporte\ames-workstation\START_AGENT_CANONICAL.ps1','package\suporte\ames-workstation\DIAGNOSTICO_POSTO.ps1','package\network\ensure_ames_route.ps1')){
            $tokens=$null;$errors=$null
            [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $file),[ref]$tokens,[ref]$errors)|Out-Null
            if($errors.Count){$errors|ForEach-Object{Write-Host $_.Message -ForegroundColor Red};throw "PowerShell parse failed: $file"}
          }
          Write-Host 'Windows launcher syntax OK' -ForegroundColor Green

      - name: Run real first-use installer from exact ZIP
        shell: cmd
        working-directory: package
        run: |
          call 01_INSTALAR_UMA_VEZ.bat /auto
          if errorlevel 1 exit /b %errorlevel%
          if not exist ".venv\Scripts\python.exe" exit /b 41
          if not exist "ames-agent\config.json" exit /b 42
          if not exist "ames-agent\data\ames_local.sqlite3" exit /b 43

      - name: Live smoke through real canonical launcher from installed CLEAN
        shell: powershell
        run: |
          $root=(Resolve-Path 'package').Path
          $starter=(Resolve-Path 'package\suporte\ames-workstation\START_AGENT_CANONICAL.ps1').Path
          $agentPid=$null
          try {
            & powershell -NoProfile -ExecutionPolicy Bypass -File $starter -Root $root -StartupTimeoutSeconds 60
            if($LASTEXITCODE -ne 0){throw "Canonical launcher first start failed with exit code $LASTEXITCODE"}

            $statePath=Join-Path $root 'logs\agent_startup_state.json'
            if(-not (Test-Path $statePath)){throw 'Launcher did not persist agent_startup_state.json'}
            $state=Get-Content $statePath -Raw | ConvertFrom-Json
            if([string]$state.status -ne 'ready'){throw "Launcher state is not ready: $($state.status) / $($state.message)"}
            if(-not $state.stdout -or -not (Test-Path ([string]$state.stdout))){throw 'Launcher did not create stdout evidence file'}
            if(-not $state.stderr -or -not (Test-Path ([string]$state.stderr))){throw 'Launcher did not create stderr evidence file'}

            $ready=Invoke-RestMethod 'http://127.0.0.1:8765/api/v1/ready' -TimeoutSec 5
            if(-not $ready.ready){throw 'Exact clean ZIP agent is not ready after launcher success'}
            if([string]$ready.agent_build -ne 'CANONICAL-R11-BATCH'){throw "Unexpected build: $($ready.agent_build)"}
            $agentPid=[int]$ready.pid

            # /health is consumed by the real UI, so it must remain bounded even on
            # a cold Windows runner with no factory Wi-Fi, route or A-MES server.
            $healthTimer=[Diagnostics.Stopwatch]::StartNew()
            $health=Invoke-RestMethod 'http://127.0.0.1:8765/api/v1/health' -TimeoutSec 5
            $healthTimer.Stop()
            if(-not $health.ok){throw 'Health endpoint not OK'}
            if($healthTimer.Elapsed.TotalSeconds -ge 5){throw "Health exceeded local UI budget: $($healthTimer.Elapsed.TotalSeconds)s"}
            if([IO.Path]::GetFullPath([string]$health.package_root).TrimEnd([char]92) -ine [IO.Path]::GetFullPath($root).TrimEnd([char]92)){throw 'Health reported wrong package root'}
            if(@('pending_guardian','guardian_cache') -notcontains [string]$health.network.detail_source){throw "Health used unexpected network source: $($health.network.detail_source)"}

            $html=Invoke-WebRequest 'http://127.0.0.1:8765/Central-de-Controle-/' -UseBasicParsing -TimeoutSec 5
            if($html.StatusCode -ne 200 -or $html.Content -notmatch 'Central'){throw 'Local frontend not served from exact ZIP'}

            $tokenPath=Join-Path $root 'ames-agent\data\local_agent_token'
            $configPath=Join-Path $root 'ames-agent\config.json'
            $dbPath=Join-Path $root 'ames-agent\data\ames_local.sqlite3'
            $token=(Get-Content $tokenPath -Raw).Trim()
            if($token.Length -lt 32){throw 'Local agent token missing/invalid after launcher start'}
            $headers=@{'X-Central-Agent-Token'=$token}

            $identity=Invoke-RestMethod 'http://127.0.0.1:8765/api/v1/v2/capabilities' -Headers $headers -TimeoutSec 5
            if(-not $identity.native_console){throw 'Canonical capabilities missing native_console'}
            if([IO.Path]::GetFullPath([string]$identity.package_root).TrimEnd([char]92) -ine [IO.Path]::GetFullPath($root).TrimEnd([char]92)){throw 'Capabilities reported wrong package root'}

            $unauthorized=$false
            try{
              Invoke-RestMethod 'http://127.0.0.1:8765/api/v1/hardening/health' -TimeoutSec 5 | Out-Null
            }catch{
              if($_.Exception.Response -and [int]$_.Exception.Response.StatusCode -eq 401){$unauthorized=$true}else{throw}
            }
            if(-not $unauthorized){throw 'Detailed hardening diagnostics must reject unauthenticated callers'}

            $hardening=Invoke-RestMethod 'http://127.0.0.1:8765/api/v1/hardening/health' -Headers $headers -TimeoutSec 8
            if(-not $hardening.ok -or [string]$hardening.hardening -ne 'H1'){throw 'Hardening health not OK'}
            if([string]$hardening.integrity -ne 'ok'){throw 'SQLite integrity is not OK'}
            if(-not $hardening.performance_indexes.ok){throw 'SQLite performance indexes are incomplete in installed CLEAN'}

            $cap=Invoke-RestMethod 'http://127.0.0.1:8765/api/v1/3012/capability' -Headers $headers -TimeoutSec 5
            if(-not $cap.implemented -or $cap.factory_validated){throw '3012 capability/gate contract invalid'}
            $body=@{ames_start_date='2026-02-01'}|ConvertTo-Json
            $saved=Invoke-RestMethod 'http://127.0.0.1:8765/api/v1/config' -Method Post -Headers $headers -ContentType 'application/json' -Body $body -TimeoutSec 5
            if([string]$saved.config.ames_start_date -ne '2026-02-01'){throw 'ames_start_date did not persist through hardened config'}
            $savedFile=Get-Content $configPath -Raw | ConvertFrom-Json
            if([string]$savedFile.ames_start_date -ne '2026-02-01'){throw 'ames_start_date was not persisted to config.json'}
            if(-not (Test-Path $dbPath) -or (Get-Item $dbPath).Length -le 0){throw 'Operational SQLite missing/empty before restart validation'}

            # Idempotency is part of the contract: a second launch must recognize
            # the same authenticated H1 agent, not kill it or collide logs.
            & powershell -NoProfile -ExecutionPolicy Bypass -File $starter -Root $root -StartupTimeoutSeconds 30
            if($LASTEXITCODE -ne 0){throw "Canonical launcher second start failed with exit code $LASTEXITCODE"}
            $ready2=Invoke-RestMethod 'http://127.0.0.1:8765/api/v1/ready' -TimeoutSec 5
            if([int]$ready2.pid -ne $agentPid){throw "Second launcher invocation replaced a healthy agent: $agentPid -> $($ready2.pid)"}

            # Controlled process restart: this is not an OS reboot gate. It proves
            # that local identity/config/SQLite survive a real agent stop/start.
            $firstPid=$agentPid
            $tokenBeforeRestart=$token
            Stop-Process -Id $firstPid -Force -ErrorAction Stop
            $stopped=$false
            for($i=0;$i -lt 60;$i++){
              $processAlive=Get-Process -Id $firstPid -ErrorAction SilentlyContinue
              $listener=Get-NetTCPConnection -LocalPort 8765 -State Listen -ErrorAction SilentlyContinue | Select-Object -First 1
              if(-not $processAlive -and -not $listener){$stopped=$true;break}
              Start-Sleep -Milliseconds 100
            }
            if(-not $stopped){throw 'Agent did not fully stop before controlled restart'}
            $agentPid=$null

            & powershell -NoProfile -ExecutionPolicy Bypass -File $starter -Root $root -StartupTimeoutSeconds 60
            if($LASTEXITCODE -ne 0){throw "Canonical launcher restart failed with exit code $LASTEXITCODE"}
            $ready3=Invoke-RestMethod 'http://127.0.0.1:8765/api/v1/ready' -TimeoutSec 5
            if(-not $ready3.ready){throw 'Agent did not become ready after controlled restart'}
            $agentPid=[int]$ready3.pid
            if($agentPid -eq $firstPid){throw "Controlled restart reused old PID unexpectedly: $firstPid"}

            $tokenAfterRestart=(Get-Content $tokenPath -Raw).Trim()
            if($tokenAfterRestart -ne $tokenBeforeRestart){throw 'Local workstation token changed across controlled restart'}
            $savedFileAfter=Get-Content $configPath -Raw | ConvertFrom-Json
            if([string]$savedFileAfter.ames_start_date -ne '2026-02-01'){throw 'config.json lost ames_start_date across controlled restart'}
            if(-not (Test-Path $dbPath) -or (Get-Item $dbPath).Length -le 0){throw 'Operational SQLite missing/empty after controlled restart'}

            $headersAfter=@{'X-Central-Agent-Token'=$tokenAfterRestart}
            $identityAfter=Invoke-RestMethod 'http://127.0.0.1:8765/api/v1/v2/capabilities' -Headers $headersAfter -TimeoutSec 5
            if(-not $identityAfter.native_console){throw 'Canonical capabilities missing after controlled restart'}
            if([IO.Path]::GetFullPath([string]$identityAfter.package_root).TrimEnd([char]92) -ine [IO.Path]::GetFullPath($root).TrimEnd([char]92)){throw 'Restarted agent reported wrong package root'}
            $hardeningAfter=Invoke-RestMethod 'http://127.0.0.1:8765/api/v1/hardening/health' -Headers $headersAfter -TimeoutSec 8
            if(-not $hardeningAfter.ok -or [string]$hardeningAfter.integrity -ne 'ok'){throw 'SQLite/H1 failed after controlled restart'}
            if(-not $hardeningAfter.performance_indexes.ok){throw 'SQLite performance indexes incomplete after controlled restart'}

            Write-Host "LIVE CLEAN RESTART OK: firstPID=$firstPid restartPID=$agentPid token/config/SQLite preserved" -ForegroundColor Green
          } finally {
            if($agentPid){Stop-Process -Id $agentPid -Force -ErrorAction SilentlyContinue}
            else {
              $listener=Get-NetTCPConnection -LocalPort 8765 -State Listen -ErrorAction SilentlyContinue | Select-Object -First 1
              if($listener){Stop-Process -Id $listener.OwningProcess -Force -ErrorAction SilentlyContinue}
            }
          }

      - name: Legacy agent reoccupation and unknown-owner Windows gate
        shell: powershell
        run: ./scripts/ames-bootstrap-race.windows.ps1 -Root (Resolve-Path 'package').Path

      - name: Preserve Windows startup evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-bootstrap-evidence-${{ github.sha }}
          path: package/logs/
          if-no-files-found: warn
          retention-days: 14

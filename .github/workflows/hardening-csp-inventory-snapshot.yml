name: Temporary CSP style-runtime detail

on:
  push:
    branches:
      - hardening/p0-production-readiness
    paths:
      - .github/workflows/hardening-csp-inventory-snapshot.yml

permissions:
  contents: read

jobs:
  inventory:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Generate current CSP inventory
        run: node scripts/csp-inventory.mjs > csp-inventory-current.json
      - name: Classify inline style attributes and runtime style writes
        shell: python
        run: |
          from html.parser import HTMLParser
          from pathlib import Path
          import json,re

          class P(HTMLParser):
              def __init__(self):
                  super().__init__(convert_charrefs=True)
                  self.rows=[]
              def handle_starttag(self,tag,attrs):
                  data=dict(attrs)
                  if 'style' in data:
                      self.rows.append({
                          'line': self.getpos()[0],
                          'tag': tag,
                          'id': data.get('id'),
                          'class': data.get('class'),
                          'style': data.get('style') or ''
                      })
              def handle_startendtag(self,tag,attrs):
                  self.handle_starttag(tag,attrs)

          p=P(); p.feed(Path('index.html').read_text())
          for row in p.rows:
              s=row['style'].lower()
              row['initial_state_hint']=any(token in s for token in ('display:none','display: none','visibility:hidden','visibility: hidden','opacity:0','opacity: 0'))
              row['geometry_hint']=any(token in s for token in ('width:','height:','top:','left:','right:','bottom:','transform:','position:'))
          Path('csp-inline-style-detail.json').write_text(json.dumps({'count':len(p.rows),'rows':p.rows},indent=2,ensure_ascii=False))

          files=[Path('app.js')]
          for root in (Path('ames'),Path('core')):
              files += [x for x in root.rglob('*') if x.suffix in ('.js','.mjs')]
          patterns={
              'set_attribute_style': re.compile(r"\.setAttribute\s*\(\s*['\"]style['\"]",re.I),
              'style_css_text': re.compile(r"\.style\.cssText\s*=",re.I),
              'style_direct_property': re.compile(r"\.style\.[A-Za-z_$][\w$]*\s*=",re.I),
              'style_set_property': re.compile(r"\.style\.setProperty\s*\(",re.I),
              'style_attribute_assignment': re.compile(r"\.style\s*=\s*['\"]",re.I)
          }
          hits={k:[] for k in patterns}
          for file in files:
              if not file.exists(): continue
              text=file.read_text(errors='replace')
              for name,pat in patterns.items():
                  for m in pat.finditer(text):
                      line=text.count('\n',0,m.start())+1
                      excerpt=text[m.start():m.start()+140].split('\n',1)[0]
                      hits[name].append({'file':str(file),'line':line,'excerpt':excerpt})
          Path('csp-style-runtime-detail.json').write_text(json.dumps({
              'counts':{k:len(v) for k,v in hits.items()},
              'hits':hits
          },indent=2,ensure_ascii=False))
      - name: Upload inventory detail
        uses: actions/upload-artifact@v6
        with:
          name: csp-style-runtime-detail-${{ github.sha }}
          path: |
            csp-inventory-current.json
            csp-inline-style-detail.json
            csp-style-runtime-detail.json
          if-no-files-found: error
          retention-days: 1

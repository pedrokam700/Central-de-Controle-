name: One-shot local Service Worker readiness reconciliation

on:
  push:
    branches:
      - hardening/p0-production-readiness
    paths:
      - '.github/workflows/hardening-reconcile-local-sw-readiness.yml'

permissions:
  contents: write

jobs:
  reconcile:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Reconcile local Service Worker readiness
        run: node scripts/hardening-reconcile-local-sw-readiness.mjs
      - name: Validate environment blockers remain
        run: |
          node -e "const x=require('./hardening/production-readiness.json');const i=x.gates.immutable_frontend_distribution,o=x.gates.offline_readiness,r=[...(i.remaining||[]),...(o.remaining||[])].join('\\n');for(const t of ['launcher','CORA','Windows','Firebase Auth','never-prepared local origin'])if(!r.includes(t))process.exit(1);if(x.promotion.stable_allowed||x.promotion.main_merge_allowed||x.promotion.production_rules_publish_allowed)process.exit(1);"
      - name: Remove one-shot tooling
        run: rm scripts/hardening-reconcile-local-sw-readiness.mjs .github/workflows/hardening-reconcile-local-sw-readiness.yml
      - name: Commit validated readiness only
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add hardening/production-readiness.json scripts/hardening-reconcile-local-sw-readiness.mjs .github/workflows/hardening-reconcile-local-sw-readiness.yml
          git diff --cached --quiet && { echo 'No validated readiness change'; exit 1; }
          git commit -m 'Hardening: reconcile local Service Worker readiness'
          git push origin HEAD:hardening/p0-production-readiness

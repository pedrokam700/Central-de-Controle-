# GitHub main + immutable GitHub Releases are the only source of truth.
# GitHub Pages serves the files built from the latest VERIFIED GitHub Release,
# not from a newer draft/unchecked main commit or a different hosting provider.
name: Publish Official Central on GitHub Pages

on:
  release:
    types: [published]
  # Releases created by GITHUB_TOKEN do not emit ordinary 'release' workflow triggers.
  # 'workflow_run' updates Pages after the official release pipeline succeeds.
  workflow_run:
    workflows: [Publish Official A-MES Multi-PC Field Release]
    types: [completed]
    branches: [main]
  push:
    branches: [main]
    paths:
      - .github/workflows/publish-github-pages.yml
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

concurrency:
  group: github-pages-official-release
  cancel-in-progress: false

jobs:
  publish:
    name: Build official release and deploy GitHub Pages
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 18
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Resolve immutable latest GitHub Release and validate CLEAN evidence
        id: release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api "/repos/$GITHUB_REPOSITORY/releases/latest" > "$RUNNER_TEMP/official-release.json"
          python3 - "$RUNNER_TEMP/official-release.json" >> "$GITHUB_OUTPUT" <<'PY'
          import json,re,sys
          r=json.load(open(sys.argv[1],encoding='utf-8'))
          sha=r.get('target_commitish','')
          tag=r.get('tag_name','')
          assert re.fullmatch('[0-9a-f]{40}',sha), 'Official release lacks exact commit SHA'
          assert re.fullmatch(r'ames-v0\.5\.\d+-multipc-\d{8}',tag), 'Unexpected release tag'
          matches=[a for a in r.get('assets',[]) if a.get('name')==f'AMES_Central_CLEAN_{sha[:8]}.zip'
              and re.fullmatch(r'sha256:[0-9a-f]{64}',a.get('digest') or '') and (a.get('size') or 0)>0]
          assert len(matches)==1, 'Release must have exactly one verified matching CLEAN ZIP with digest'
          assert not r.get('draft') and not r.get('prerelease'), 'Do not deploy draft/prerelease'
          print(f"sha={sha}")
          print(f"tag={tag}")
          print(f"Clean verified: {matches[0]['name']} {matches[0]['digest']}",file=sys.stderr)
          PY

      - name: Checkout EXACT official GitHub Release commit, not newer unapproved code
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.release.outputs.sha }}
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Verify official source and build the Central
        env:
          COMMIT: ${{ steps.release.outputs.sha }}
          BRANCH: main
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$COMMIT"
          node --test scripts/ames-deploy-routing.test.mjs scripts/ames-onboarding.test.mjs
          node scripts/build-static.mjs
          test -s "dist/Central-de-Controle-/index.html"
          test -s "dist/Central-de-Controle-/offline-bootstrap.mjs"
          test -s "dist/release-build.json"
          cp dist/release-build.json dist/Central-de-Controle-/release-build.json
          touch dist/Central-de-Controle-/.nojekyll
          python3 - <<'PY'
          import json,os
          from pathlib import Path
          p=Path('dist/Central-de-Controle-')
          m=json.loads((p/'release-build.json').read_text())
          assert m['sha']==os.environ['COMMIT'], 'Pages artifact is not release SHA'
          assert (p/'index.html').exists() and (p/'sw.js').exists()
          assert (p/'ames'/'release-discovery.mjs').exists()
          assert not any(f.suffix.lower() in ('.sqlite','.sqlite3','.db','.pem','.key')
                         for f in p.rglob('*') if f.is_file()), 'Private local database/key cannot be published'
          print('GitHub Pages static artifact ready for official',m['sha'])
          PY

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload only site root, without duplicate /Central-de-Controle-/ nesting
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist/Central-de-Controle-

      - name: Wait for GitHub artifact index before deployment
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # The upload action may succeed while the GitHub Pages deployment API
          # momentarily reports zero artifacts. A blind rerun of the same run
          # can then create a duplicate "github-pages" artifact; fail closed.
          for attempt in $(seq 1 18); do
            count="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts?per_page=100" \
              --jq '[.artifacts[] | select(.name == "github-pages" and .expired == false)] | length')"
            if [ "$count" -eq 1 ]; then echo "Pages artifact indexed: one verified entry"; exit 0; fi
            if [ "$count" -gt 1 ]; then
              echo "::error::Multiple Pages artifacts in same run. Start a NEW workflow run instead of rerunning this one."
              exit 1
            fi
            sleep 5
          done
          echo "::error::Pages artifact not indexed after upload; do not deploy or rerun this same attempt."
          exit 1

      - name: Publish GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Verify public Pages serves exact SHA and real home/entry assets
        shell: bash
        env:
          EXPECTED_SHA: ${{ steps.release.outputs.sha }}
        run: |
          set -euo pipefail
          url="https://pedrokam700.github.io/Central-de-Controle-/release-build.json"
          for attempt in $(seq 1 12); do
            if curl --fail --location --silent --show-error --max-time 10 --header 'Cache-Control: no-cache' "$url?check=$GITHUB_RUN_ID-$attempt" -o "$RUNNER_TEMP/pages-release.json"; then
              if python3 - "$RUNNER_TEMP/pages-release.json" <<'PY'
          import json,os,sys
          try: assert json.load(open(sys.argv[1]))['sha']==os.environ['EXPECTED_SHA']
          except (AssertionError,ValueError,KeyError,TypeError): sys.exit(1)
          PY
              then
                # A valid release-build.json alone is insufficient: a user may
                # still receive a GitHub Pages 404 at the actual entry route.
                root="https://pedrokam700.github.io/Central-de-Controle/"
                root_status="$(curl --location --silent --show-error --max-time 10 --header 'Cache-Control: no-cache' \
                  --output "$RUNNER_TEMP/pages-home.html" --write-out '%{http_code}' \
                  "${root}?check=$GITHUB_RUN_ID-$attempt" || echo 000)"
                index_status="$(curl --location --silent --show-error --max-time 10 --header 'Cache-Control: no-cache' \
                  --output "$RUNNER_TEMP/pages-index.html" --write-out '%{http_code}' \
                  "${root}index.html?check=$GITHUB_RUN_ID-$attempt" || echo 000)"
                boot_status="$(curl --location --silent --show-error --max-time 10 --header 'Cache-Control: no-cache' \
                  --output "$RUNNER_TEMP/pages-bootstrap.mjs" --write-out '%{http_code}' \
                  "${root}offline-bootstrap.mjs?check=$GITHUB_RUN_ID-$attempt" || echo 000)"
                if [ "$root_status" = "200" ] && [ "$index_status" = "200" ] && [ "$boot_status" = "200" ] \
                  && grep -qi '<!doctype html>' "$RUNNER_TEMP/pages-home.html" \
                  && grep -qi '<!doctype html>' "$RUNNER_TEMP/pages-index.html" \
                  && grep -q 'Central-de-Controle-' "$RUNNER_TEMP/pages-home.html"; then
                  echo "Public GitHub Pages verified: SHA=$EXPECTED_SHA home=200 index=200 bootstrap=200"
                  exit 0
                fi
                echo "Pages entry not yet valid: home=$root_status index=$index_status bootstrap=$boot_status" >&2
              fi
            fi
            sleep 10
          done
          echo "::error::GitHub Pages URL did not prove the official GitHub Release SHA"
          exit 1

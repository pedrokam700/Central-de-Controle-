name: One-shot factory evidence bundle/docs integration

on:
  push:
    branches:
      - hardening/p0-production-readiness
    paths:
      - .github/workflows/hardening-integrate-factory-evidence.yml

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: hardening/p0-production-readiness
          fetch-depth: 0
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Apply exact bundle/docs integration
        run: node scripts/patch-factory-evidence-bundle-docs.mjs
      - name: Validate factory evidence and bundle contracts
        env:
          PYTHON_BIN: python3
        run: |
          python3 -m py_compile tools/ames-workstation/factory-validation-evidence.py
          node --test scripts/ames-factory-validation-evidence.test.mjs
          python3 scripts/agent-r12-bundle-v5.test.py
      - name: Validate no runtime activation or candidate replacement
        run: |
          node - <<'NODE'
          const fs=require('fs');
          const builder=fs.readFileSync('scripts/build-r12-migration-bundle-v5.py','utf8');
          const doc=fs.readFileSync('docs/ames/FACTORY_GATE_R12.md','utf8');
          if(!builder.includes('suporte/ames-workstation/factory-validation-evidence.py')) throw new Error('support tool missing');
          if(!doc.includes('5e45127d3b61b37968a4c2b05596919670b307cb')) throw new Error('frozen physical candidate missing');
          if(!doc.includes('não substitui')) throw new Error('supplemental hardening boundary missing');
          if(/local_frontend_launcher_default[^\n]*True/.test(builder)) throw new Error('launcher default changed');
          NODE
      - name: Remove one-shot tooling
        run: rm scripts/patch-factory-evidence-bundle-docs.mjs .github/workflows/hardening-integrate-factory-evidence.yml
      - name: Commit validated integration
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m 'Hardening: integrate sanitized factory evidence tooling'
          git push origin HEAD:hardening/p0-production-readiness

name: One-shot CORA MES egress runtime patch

on:
  push:
    branches:
      - hardening/p0-production-readiness
    paths:
      - .github/workflows/hardening-cora-mes-egress-runtime-patch.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact hardening head
        uses: actions/checkout@v7
        with:
          ref: hardening/p0-production-readiness
          fetch-depth: 0
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Refuse moved branch
        run: test "$(git rev-parse HEAD)" = "$GITHUB_SHA" || { echo "Branch moved; fail closed."; exit 1; }
      - name: Apply exact anchored patch
        run: node scripts/apply-cora-mes-egress-runtime-patch.mjs
      - name: Parse app and run focused CORA egress tests
        run: |
          node --check app.js
          node --test scripts/ames-cora-egress-policy.test.mjs scripts/ames-cora-egress-transport.test.mjs scripts/ames-cora-external-projection.test.mjs scripts/ames-cora-mes-egress-app.test.mjs
          git diff --check -- app.js sw.js scripts/ames-cora-mes-egress-app.test.mjs
      - name: Commit patched runtime and remove one-shot machinery
        run: |
          rm .github/workflows/hardening-cora-mes-egress-runtime-patch.yml
          rm scripts/apply-cora-mes-egress-runtime-patch.mjs
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.js sw.js scripts/ames-cora-mes-egress-app.test.mjs .github/workflows/hardening-cora-mes-egress-runtime-patch.yml scripts/apply-cora-mes-egress-runtime-patch.mjs
          git diff --cached --check
          git commit -m "Hardening: sanitize MES context at CORA runtime egress boundary"
          git push origin HEAD:hardening/p0-production-readiness

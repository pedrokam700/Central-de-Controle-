name: One-shot CORA client egress readiness reconciliation

on:
  push:
    branches:
      - hardening/p0-production-readiness
    paths:
      - .github/workflows/hardening-cora-client-egress-readiness.yml

permissions:
  contents: write

jobs:
  reconcile:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Verify exact branch head
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin hardening/p0-production-readiness
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git rev-parse origin/hardening/p0-production-readiness)" = "$GITHUB_SHA"
      - name: Reconcile CORA client egress readiness
        run: node scripts/reconcile-cora-client-egress-readiness.mjs
      - name: Validate readiness and boundary contracts remain fail-closed
        shell: bash
        run: |
          set -euo pipefail
          node --test \
            scripts/production-readiness.test.mjs \
            scripts/ames-cora-direct-fetch-boundary-app.test.mjs \
            scripts/ames-cora-network-boundary-app.test.mjs \
            scripts/ames-cora-network-boundary.test.mjs \
            scripts/ames-cora-egress-transport.test.mjs \
            scripts/ames-cora-egress-policy.test.mjs
          git diff --check
      - name: Remove one-shot tooling
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/hardening-cora-client-egress-readiness.yml
          rm -f scripts/reconcile-cora-client-egress-readiness.mjs
          git diff --check
      - name: Commit reconciled readiness only after validation
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin hardening/p0-production-readiness
          test "$(git rev-parse origin/hardening/p0-production-readiness)" = "$GITHUB_SHA"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && { echo "No CORA readiness changes"; exit 1; }
          git commit -m "Hardening: reconcile CORA client egress readiness"
          git push origin HEAD:hardening/p0-production-readiness

name: Central Quality Gate

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  static-quality:
    name: Static quality checks
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Install test-only Excel reader
        run: python3 -m pip install openpyxl==3.1.5

      - name: Run database and snapshot hardening tests
        run: python3 scripts/agent-hardening.test.py

      - name: Run auth hardening contract
        run: node --test scripts/ames-auth-hardening.test.mjs

      - name: Run local agent pairing contract
        run: node --test scripts/ames-agent-pairing.test.mjs

      - name: Run remaining A-MES Node contract suites
        run: node --test --test-isolation=none $(find scripts -maxdepth 1 -type f -name 'ames-*.test.mjs' ! -name 'ames-auth-hardening.test.mjs' ! -name 'ames-agent-pairing.test.mjs' | sort)

      - name: Run scheduler Python contract
        run: python3 scripts/agent-scheduler.test.py

      - name: Run canonical Python contract
        run: python3 scripts/agent-canonical.test.py

      - name: Run updater Python contract
        run: python3 scripts/agent-update.test.py

      - name: Run Central quality gate
        env:
          PYTHON_BIN: python3
        run: node scripts/quality-gate.mjs

      - name: Build R12 existing-install migration bundle
        env:
          FRONTEND_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: python3 scripts/build-r12-migration-bundle.py "$RUNNER_TEMP/central-v2-r12-migration-${FRONTEND_SHA}.zip" --frontend-sha "$FRONTEND_SHA"

      - name: Upload R12 migration bundle
        uses: actions/upload-artifact@v6
        with:
          name: central-v2-r12-migration-${{ github.event.pull_request.head.sha || github.sha }}
          path: ${{ runner.temp }}/central-v2-r12-migration-${{ github.event.pull_request.head.sha || github.sha }}.zip
          if-no-files-found: error
          retention-days: 7

  node-contract-diagnostics:
    name: Node contract · ${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: agent
            file: scripts/ames-agent.test.mjs
          - name: base-catalog
            file: scripts/ames-base-catalog.test.mjs
          - name: cache
            file: scripts/ames-cache.test.mjs
          - name: capabilities
            file: scripts/ames-capabilities.test.mjs
          - name: data
            file: scripts/ames-data.test.mjs
          - name: hardening
            file: scripts/ames-hardening.test.mjs
          - name: offline-central
            file: scripts/ames-offline-central.test.mjs
          - name: offline-outbox
            file: scripts/ames-offline-outbox.test.mjs
          - name: sync
            file: scripts/ames-sync.test.mjs
          - name: candidate-preview
            file: scripts/ames-candidate-preview.test.mjs
          - name: deploy-routing
            file: scripts/ames-deploy-routing.test.mjs
          - name: offline-shell
            file: scripts/ames-offline-shell.test.mjs
          - name: onboarding
            file: scripts/ames-onboarding.test.mjs
          - name: preview-origin
            file: scripts/ames-preview-origin.test.mjs
          - name: r12-capture
            file: scripts/ames-r12-capture.test.mjs
          - name: r12-migration-bundle
            file: scripts/ames-r12-migration-bundle.test.mjs
          - name: release-build
            file: scripts/ames-release-build.test.mjs
          - name: workstation-bootstrap
            file: scripts/ames-workstation-bootstrap.test.mjs
          - name: workstation-config
            file: scripts/ames-workstation-config.test.mjs
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Run ${{ matrix.file }}
        run: node --test --test-isolation=none ${{ matrix.file }}

  sync-emulator:
    name: Agent and sync E2E with Firestore Rules
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Install test dependencies outside app
        run: |
          python3 -m pip install openpyxl==3.1.5
          npm install --prefix "$RUNNER_TEMP/ames-tests" firebase-tools@15.2.1 @firebase/rules-unit-testing@5.0.0 firebase@12.7.0
      - name: Rules and cross-PC pipeline
        env:
          PYTHON_BIN: python3
        run: |
          export FIREBASE_TEST_MODULES="$RUNNER_TEMP/ames-tests/node_modules"
          "$RUNNER_TEMP/ames-tests/node_modules/.bin/firebase" emulators:exec --only firestore --project demo-central-mes 'node scripts/ames-rules.emulator.mjs && node scripts/ames-e2e.emulator.mjs'

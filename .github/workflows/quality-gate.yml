name: Central Quality Gate

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  static-quality:
    name: Static quality checks
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Install test-only Excel reader
        run: python3 -m pip install openpyxl==3.1.5

      - name: Run Central quality gate
        env:
          PYTHON_BIN: python3
        run: node scripts/quality-gate.mjs

  sync-emulator:
    name: Agent and sync E2E with Firestore Rules
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Install test dependencies outside app
        run: |
          python3 -m pip install openpyxl==3.1.5
          npm install --prefix "$RUNNER_TEMP/ames-tests" firebase-tools@15.2.1 @firebase/rules-unit-testing@5.0.0 firebase@12.7.0
      - name: Rules and cross-PC pipeline
        env:
          PYTHON_BIN: python3
        run: |
          export FIREBASE_TEST_MODULES="$RUNNER_TEMP/ames-tests/node_modules"
          "$RUNNER_TEMP/ames-tests/node_modules/.bin/firebase" emulators:exec --only firestore --project demo-central-mes 'node scripts/ames-rules.emulator.mjs && node scripts/ames-e2e.emulator.mjs'

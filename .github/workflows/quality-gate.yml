name: Central Quality Gate

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  static-quality:
    name: Static quality checks
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Install test-only Excel reader
        run: python3 -m pip install openpyxl==3.1.5

      - name: Run database and snapshot hardening tests
        run: python3 scripts/agent-hardening.test.py

      - name: Run preserved source capture and revision contracts
        run: |
          python3 scripts/agent-source-capture.test.py
          python3 scripts/agent-capture-manifest.test.py
          python3 scripts/agent-trace-target.test.py
          python3 scripts/agent-3074-coverage-summary.test.py
          python3 scripts/agent-package-contract.test.py
          python3 scripts/agent-integrated-v5.test.py

      - name: Run operational calendar tests
        run: python3 scripts/agent-operational-calendar.test.py

      - name: Run read-only workstation preflight tests
        run: python3 scripts/agent-preflight.test.py

      - name: Run individual SN source isolation tests
        run: python3 scripts/agent-individual-assembly.test.py

      - name: Run deep 3028 occurrence-to-3074 Home page regression
        run: python3 scripts/agent-deep-3074-page.test.py

      - name: Run 3074 View response and stale-grid regression tests
        run: |
          python3 scripts/agent-3074-grid-lifecycle.test.py
          python3 scripts/agent-3074-pagination.test.py
          python3 scripts/agent-assembly-scope.test.py
          python3 scripts/agent-multi-cycle-3028-3074.test.py
          python3 scripts/agent-3074-uncertain-reuse.test.py
          python3 scripts/agent-3074-projection-audit.test.py

      - name: Run auth hardening contract
        run: node --test scripts/ames-auth-hardening.test.mjs

      - name: Run local agent pairing contract
        run: |
          node --test scripts/ames-agent-pairing.test.mjs
          python3 scripts/agent-loopback-origin.test.py
          python3 scripts/agent-workstation-pairing.test.py
          python3 scripts/agent-pair-http-integration.test.py

      - name: Run A-MES Node contract suites
        run: node --test --test-isolation=none $(find scripts -maxdepth 1 -type f -name 'ames-*.test.mjs' ! -name 'ames-auth-hardening.test.mjs' ! -name 'ames-agent-pairing.test.mjs' | sort)

      - name: Run scheduler Python contract
        run: python3 scripts/agent-scheduler.test.py

      - name: Run canonical Python contract
        run: python3 scripts/agent-canonical.test.py

      - name: Run updater Python contract
        run: |
          python3 scripts/agent-pr69-code-patch.test.py
          python3 scripts/agent-update.test.py
          python3 scripts/agent-issue57-update-preflight.test.py
          python3 scripts/agent-issue57-maintenance-ledger.test.py
          python3 scripts/agent-issue57-drain-protocol.test.py
          python3 scripts/agent-issue57-transaction-simulation.test.py
          python3 scripts/agent-issue57-integrated-recovery.test.py
          python3 scripts/agent-issue57-direct-python-recovery.test.py

      - name: Agent auto-start registry contract (mocked, no real Windows changes)
        run: python3 scripts/agent-workstation-autostart.test.py

      - name: CLEAN V3 integration and Shift contract
        run: python3 scripts/agent-clean-v3.test.py

      - name: Run Central quality gate
        env:
          PYTHON_BIN: python3
        run: node scripts/quality-gate.mjs

      - name: Build integrated local candidate
        run: python3 scripts/build-integrated-candidate.py "$RUNNER_TEMP/central-ames-integrated.zip"

      - name: Preserve synthetic installation identity through update and rollback
        run: python3 scripts/agent-pr38-preserving-stage.test.py

      - name: Upload integrated local candidate
        uses: actions/upload-artifact@v6
        with:
          name: central-ames-integrated-${{ github.event.pull_request.head.sha || github.sha }}
          path: ${{ runner.temp }}/central-ames-integrated.zip
          if-no-files-found: error

      - name: Build R12 existing-install migration bundle
        env:
          FRONTEND_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: python3 scripts/build-r12-migration-bundle.py "$RUNNER_TEMP/central-v2-r12-migration-${FRONTEND_SHA}.zip" --frontend-sha "$FRONTEND_SHA"

      - name: Upload R12 migration bundle
        uses: actions/upload-artifact@v6
        with:
          name: central-v2-r12-migration-${{ github.event.pull_request.head.sha || github.sha }}
          path: ${{ runner.temp }}/central-v2-r12-migration-${{ github.event.pull_request.head.sha || github.sha }}.zip
          if-no-files-found: error
          retention-days: 7

  sync-emulator:
    name: Agent and sync E2E with Firestore Rules
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Install test dependencies outside app
        run: |
          python3 -m pip install openpyxl==3.1.5
          npm install --prefix "$RUNNER_TEMP/ames-tests" firebase-tools@15.2.1 @firebase/rules-unit-testing@5.0.0 firebase@12.7.0
      - name: Rules and cross-PC pipeline
        env:
          PYTHON_BIN: python3
        run: |
          export FIREBASE_TEST_MODULES="$RUNNER_TEMP/ames-tests/node_modules"
          "$RUNNER_TEMP/ames-tests/node_modules/.bin/firebase" emulators:exec --only firestore --project demo-central-mes 'node scripts/ames-rules.emulator.mjs && node scripts/ames-e2e.emulator.mjs'

  console-experience:
    name: Console themes, languages and mobile
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Install isolated browser test tools
        run: |
          npm install --prefix "$RUNNER_TEMP/console-tests" playwright@1.62.1
          "$RUNNER_TEMP/console-tests/node_modules/.bin/playwright" install --with-deps chromium
      - name: Verify the nine Console views
        run: |
          export PLAYWRIGHT_MODULE="$RUNNER_TEMP/console-tests/node_modules/playwright/index.mjs"
          export BROWSER_OUTPUT="$RUNNER_TEMP/console-evidence"
          node scripts/ames-experience.browser.mjs
          node scripts/ames-sync-reload.browser.mjs
          node scripts/ames-pairing.browser.mjs
          node scripts/ames-3028-completion.browser.mjs
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: console-experience-${{ github.event.pull_request.head.sha || github.sha }}
          path: ${{ runner.temp }}/console-evidence

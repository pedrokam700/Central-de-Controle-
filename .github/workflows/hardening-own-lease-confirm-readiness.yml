name: One-shot own-lease confirmation readiness

on:
  push:
    branches:
      - hardening/p0-production-readiness
    paths:
      - .github/workflows/hardening-own-lease-confirm-readiness.yml

permissions:
  contents: write

jobs:
  reconcile:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Verify exact branch head
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin hardening/p0-production-readiness
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git rev-parse origin/hardening/p0-production-readiness)" = "$GITHUB_SHA"
      - name: Reconcile own-lease confirmation readiness
        run: node scripts/reconcile-own-lease-confirm-readiness.mjs
      - name: Validate dormant confirmation contract
        shell: bash
        run: |
          set -euo pipefail
          node --test \
            scripts/ames-collector-lease-confirm.test.mjs \
            scripts/ames-collector-confirm-rules.test.mjs \
            scripts/ames-collector-lease-client.test.mjs \
            scripts/ames-collector-lease-observer.test.mjs
          node -e "const x=require('./hardening/production-readiness.json');const g=x.gates.multi_collector_authority;if(g.status!=='partial_server_confirm_green_runtime_observer_not_wired_enforcement_off'||!g.full_ci_runs.includes(38186650668)||!g.remaining.some(x=>x.includes('runtime observer diagnostics'))||g.remaining.some(x=>x.includes('add a server-authoritative same-workstation')))process.exit(1)"
          git diff --check
      - name: Remove one-shot tooling
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/hardening-own-lease-confirm-readiness.yml
          rm -f scripts/reconcile-own-lease-confirm-readiness.mjs
          git diff --check
      - name: Commit only after validation
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin hardening/p0-production-readiness
          test "$(git rev-parse origin/hardening/p0-production-readiness)" = "$GITHUB_SHA"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && { echo "No own-lease readiness changes"; exit 1; }
          git commit -m "Hardening: reconcile server-confirmed collector authority groundwork"
          git push origin HEAD:hardening/p0-production-readiness

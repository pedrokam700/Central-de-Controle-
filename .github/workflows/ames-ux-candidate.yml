name: A-MES UX Physical Candidate

on:
  push:
    branches:
      - work/ames-operator-ux-parity-20261014
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-clean:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Compile local agent
        run: python -m compileall -q ames/agent ames/factory-engine

      - name: Build standalone CLEAN
        run: |
          python scripts/build-integrated-candidate.py "$RUNNER_TEMP/central-ames-integrated.zip"
          python - <<'PY'
          import json, os, zipfile
          from pathlib import Path
          z=Path(os.environ['RUNNER_TEMP'])/'central-ames-integrated.zip'
          with zipfile.ZipFile(z) as f:
              names=set(f.namelist())
              required={
                '00_INICIAR_AQUI.bat',
                '01_INSTALAR_UMA_VEZ.bat',
                'START_LOCAL_CANDIDATE.ps1',
                'ames-agent/config.example.json',
                'frontend/Central-de-Controle-/index.html',
                'CANDIDATE_MANIFEST.json',
              }
              missing=required-names
              assert not missing, f'missing CLEAN files: {missing}'
              assert 'ames-agent/config.json' not in names
              assert not any(n.startswith('ames-agent/data/') for n in names)
              manifest=json.loads(f.read('CANDIDATE_MANIFEST.json'))
              assert manifest['standalone_clean'] is True
              assert manifest['physical_gate']=='PENDING'
              print('CLEAN manifest:', manifest)
          PY

      - name: Upload exact CLEAN
        uses: actions/upload-artifact@v4
        with:
          name: central-ames-ux-${{ github.sha }}
          path: ${{ runner.temp }}/central-ames-integrated.zip
          if-no-files-found: error
          retention-days: 7

  windows-smoke:
    needs: build-clean
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: central-ames-ux-${{ github.sha }}
          path: artifact
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Extract exact uploaded CLEAN
        shell: powershell
        run: |
          $zip=(Get-ChildItem artifact -Filter '*.zip' | Select-Object -First 1).FullName
          if(-not $zip){throw 'CLEAN ZIP not found'}
          Expand-Archive -LiteralPath $zip -DestinationPath package -Force
          if(-not (Test-Path 'package\00_INICIAR_AQUI.bat')){throw '00_INICIAR_AQUI.bat missing'}
          if(Test-Path 'package\ames-agent\config.json'){throw 'CLEAN must not contain workstation config.json'}
          if(Test-Path 'package\ames-agent\data\ames_local.sqlite3'){throw 'CLEAN must not contain operational SQLite'}

      - name: Run real first-use installer
        shell: cmd
        working-directory: package
        run: |
          call 01_INSTALAR_UMA_VEZ.bat /auto
          if errorlevel 1 exit /b %errorlevel%
          if not exist ".venv\Scripts\python.exe" exit /b 41
          if not exist "ames-agent\config.json" exit /b 42
          if not exist "ames-agent\data\ames_local.sqlite3" exit /b 43

      - name: Launch canonical agent and smoke local UI
        shell: powershell
        run: |
          $root=(Resolve-Path 'package').Path
          $starter=(Resolve-Path 'package\suporte\ames-workstation\START_AGENT_CANONICAL.ps1').Path
          $pidToStop=$null
          try {
            & powershell -NoProfile -ExecutionPolicy Bypass -File $starter -Root $root -StartupTimeoutSeconds 60
            if($LASTEXITCODE -ne 0){throw "launcher failed: $LASTEXITCODE"}
            $ready=Invoke-RestMethod 'http://127.0.0.1:8765/api/v1/ready' -TimeoutSec 5
            if(-not $ready.ready){throw 'agent not ready'}
            if([string]$ready.agent_build -ne 'CANONICAL-R11-BATCH'){throw "unexpected build: $($ready.agent_build)"}
            $pidToStop=[int]$ready.pid
            $html=Invoke-WebRequest 'http://127.0.0.1:8765/Central-de-Controle-/' -UseBasicParsing -TimeoutSec 5
            if($html.StatusCode -ne 200 -or $html.Content -notmatch 'Central'){throw 'local frontend not served'}
            $manifest=Get-Content 'package\CANDIDATE_MANIFEST.json' -Raw | ConvertFrom-Json
            if([string]$manifest.sha -ne '${{ github.sha }}'){throw "manifest SHA mismatch: $($manifest.sha)"}
            Write-Host 'Windows CLEAN smoke OK' -ForegroundColor Green
          }
          finally {
            if($pidToStop){Stop-Process -Id $pidToStop -Force -ErrorAction SilentlyContinue}
          }

name: One-shot CORA backend discovery readiness reconciliation

on:
  push:
    branches:
      - hardening/p0-production-readiness
    paths:
      - .github/workflows/hardening-reconcile-cora-backend-discovery.yml

permissions:
  contents: write

jobs:
  reconcile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: hardening/p0-production-readiness
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Reconcile CORA backend discovery readiness
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          p=Path('hardening/production-readiness.json')
          data=json.loads(p.read_text(encoding='utf-8'))
          gate=data['gates']['cora_backend_version_contract']
          assert gate['status']=='blocked'
          green=gate.setdefault('green',[])
          additions=[
            'GitHub backend source discovery exhausted across all currently accessible pedrokam700 repositories without finding authoritative CORA API source',
            'Vercel central-cora-v2 project and team IDs are verified, while project, domains, production deployments and project routes each return HTTP 403 under the current connection scope'
          ]
          for item in additions:
            if item not in green: green.append(item)
          gate['blocker']='Authoritative CORA backend source/deployment remains inaccessible: no backend source exists in the currently accessible GitHub repositories, and Vercel project/domains/deployments/routes each return HTTP 403 for scope pedrokam700-6477 even with verified project/team IDs.'
          gate['full_ci_run']=38241684334
          evidence=gate.setdefault('evidence',[])
          for item in ['hardening/cora-api-contract.json','scripts/ames-cora-api-contract.test.mjs']:
            if item not in evidence: evidence.append(item)
          assert data['promotion']['stable_allowed'] is False
          assert data['promotion']['main_merge_allowed'] is False
          assert data['promotion']['production_rules_publish_allowed'] is False
          p.write_text(json.dumps(data,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          PY
      - name: Validate CORA remains blocked and promotion remains closed
        run: |
          node --test scripts/ames-cora-api-contract.test.mjs
          python3 - <<'PY'
          import json
          d=json.load(open('hardening/production-readiness.json',encoding='utf-8'))
          g=d['gates']['cora_backend_version_contract']
          assert g['status']=='blocked'
          assert g['full_ci_run']==38241684334
          assert '403' in g['blocker']
          assert d['promotion']=={
            'stable_allowed': False,
            'main_merge_allowed': False,
            'production_rules_publish_allowed': False,
            'required_before_stable': d['promotion']['required_before_stable']
          }
          PY
      - name: Remove one-shot tooling
        run: git rm .github/workflows/hardening-reconcile-cora-backend-discovery.yml
      - name: Commit validated readiness only
        run: |
          if git diff --quiet; then
            echo 'No changes to commit'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add hardening/production-readiness.json
          git commit -m 'Hardening: reconcile CORA backend discovery blocker'
          git push origin HEAD:hardening/p0-production-readiness

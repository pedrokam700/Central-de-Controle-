name: One-shot collector observer readiness

on:
  push:
    branches:
      - hardening/p0-production-readiness
    paths:
      - .github/workflows/hardening-collector-observer-readiness.yml

permissions:
  contents: write

jobs:
  reconcile:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Verify exact branch head
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin hardening/p0-production-readiness
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git rev-parse origin/hardening/p0-production-readiness)" = "$GITHUB_SHA"
      - name: Reconcile collector observer readiness
        run: node scripts/reconcile-collector-observer-readiness.mjs
      - name: Validate observer and readiness contracts
        shell: bash
        run: |
          set -euo pipefail
          node --test \
            scripts/ames-agent-workstation-identity-client.test.mjs \
            scripts/ames-collector-lease-observer.test.mjs \
            scripts/ames-collector-lease-client.test.mjs \
            scripts/ames-publication-fence.test.mjs
          node -e "const x=require('./hardening/production-readiness.json');const g=x.gates.multi_collector_authority;if(g.status!=='partial_observe_only_identity_and_lease_green_enforcement_not_active'||!g.full_ci_runs.includes(38186194411)||!g.full_ci_runs.includes(38186334738)||!g.remaining.some(x=>x.includes('server-authoritative same-workstation')))process.exit(1)"
          git diff --check
      - name: Remove one-shot tooling
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/hardening-collector-observer-readiness.yml
          rm -f scripts/reconcile-collector-observer-readiness.mjs
          git diff --check
      - name: Commit only after validation
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin hardening/p0-production-readiness
          test "$(git rev-parse origin/hardening/p0-production-readiness)" = "$GITHUB_SHA"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && { echo "No collector observer readiness changes"; exit 1; }
          git commit -m "Hardening: reconcile observe-only collector authority groundwork"
          git push origin HEAD:hardening/p0-production-readiness

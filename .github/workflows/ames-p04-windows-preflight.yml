name: A-MES P04 Windows compatibility proof (synthetic only)
on:
  push:
    branches:
      - work/ames-p04-windows-preflight-20261118
permissions:
  contents: read
jobs:
  policy-and-stdlib:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    defaults:
      run:
        shell: bash ./scripts/audit/guarded-ci.sh {0}
    env:
      PYTHONPATH: '${{ github.workspace }}/scripts/audit/no_distribution'
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: P04 policy and actual stdlib negative contracts
        run: |
          python3 -B scripts/agent-p04-compatibility.test.py -v
          python3 -B scripts/agent-p04-preservation.test.py -v
  windows-compatibility:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 12
    env:
      PYTHONPATH: '${{ github.workspace }}/scripts/audit/no_distribution'
      GIT_CONFIG_COUNT: '1'
      GIT_CONFIG_KEY_0: core.autocrlf
      GIT_CONFIG_VALUE_0: 'false'
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: P04 policy and stdlib (no launcher)
        shell: pwsh
        run: |
          python -B scripts/agent-distribution-guard-compat.test.py -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -B scripts/agent-p04-compatibility.test.py -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Verified Windows wheels actual imports SQLite timezone and incompatibilities
        shell: pwsh
        run: |
          python -B scripts/agent-p04-preservation.test.py -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -B scripts/agent-p04-ci.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
# No builder, operational entrypoint, software installer, archive or artifact upload.

name: A-MES Official Agent Shared Sync Candidate

on:
  push:
    branches:
      - fix/ames-official-agent-shared-sync-20261016

permissions:
  contents: read

jobs:
  focused-quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install quality dependency
        run: python -m pip install --disable-pip-version-check openpyxl==3.1.5
      - name: Pairing and shared-sync regression contracts
        run: |
          node --test scripts/ames-agent-cross-tab-pairing.test.mjs
          node --test scripts/ames-agent-pairing.test.mjs
          node --test scripts/ames-sync-autocapture.test.mjs
          node --test scripts/ames-sync.test.mjs
          node --test scripts/ames-multipc-shared-contract.test.mjs
          node --test scripts/ames-offline-central.test.mjs
          node --test scripts/ames-workstation-bootstrap.test.mjs
      - name: Central quality gate
        env:
          PYTHON_BIN: python
        run: node scripts/quality-gate.mjs

  firestore-emulator:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Install isolated Firebase test tools
        run: npm install --prefix "$RUNNER_TEMP/ames-tests" firebase-tools@15.2.1 @firebase/rules-unit-testing@5.0.0 firebase@12.7.0
      - name: Rules and cross-PC pipeline
        env:
          PYTHON_BIN: python3
        run: |
          export FIREBASE_TEST_MODULES="$RUNNER_TEMP/ames-tests/node_modules"
          "$RUNNER_TEMP/ames-tests/node_modules/.bin/firebase" emulators:exec --only firestore --project demo-central-mes 'node scripts/ames-rules.emulator.mjs && node scripts/ames-e2e.emulator.mjs'

  build-clean:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Compile local agent
        run: python -m compileall -q ames/agent ames/factory-engine
      - name: Build standalone CLEAN
        env:
          CENTRAL_PREVIEW_URLS: https://central-cora-v2-git-fix-ames-official-a-b3407a-pedrokam700-6477.vercel.app
        run: |
          python scripts/build-integrated-candidate.py "$RUNNER_TEMP/central-ames-integrated.zip"
          python - <<'PY'
          import json, os, zipfile
          from pathlib import Path
          z=Path(os.environ['RUNNER_TEMP'])/'central-ames-integrated.zip'
          with zipfile.ZipFile(z) as f:
              names=set(f.namelist())
              required={'00_INICIAR_AQUI.bat','INICIAR_POSTO_CENTRAL_V2.bat','FRONTEND_GATE.json','01_INSTALAR_UMA_VEZ.bat','START_LOCAL_CANDIDATE.ps1','ames-agent/config.example.json','frontend/Central-de-Controle-/index.html','CANDIDATE_MANIFEST.json'}
              missing=required-names
              assert not missing, f'missing CLEAN files: {missing}'
              assert 'ames-agent/config.json' not in names
              assert not any(n.startswith('ames-agent/data/') for n in names)
              manifest=json.loads(f.read('CANDIDATE_MANIFEST.json'))
              assert manifest['standalone_clean'] is True
              assert manifest['physical_gate']=='PENDING'
              assert manifest['sha']=='${{ github.sha }}'
              entry=f.read('00_INICIAR_AQUI.bat').decode('utf-8','replace')
              assert 'INICIAR_POSTO_CENTRAL_V2.bat' in entry and 'FRONTEND_GATE.json' in entry
              canonical=f.read('INICIAR_POSTO_CENTRAL_V2.bat').decode('utf-8','replace')
              assert 'FRONTEND_GATE.json' in canonical and 'ames_agent_token' in canonical
              gate=json.loads(f.read('FRONTEND_GATE.json'))
              assert gate['expected_sha']=='${{ github.sha }}'
              assert any('central-cora-v2-git-fix-ames-official' in u for u in gate['preview_urls'])
              cfg=json.loads(f.read('ames-agent/config.example.json'))
              assert any('central-cora-v2-git-fix-ames-official' in u for u in cfg['allowed_origins'])
          PY
      - name: Upload exact CLEAN
        uses: actions/upload-artifact@v4
        with:
          name: central-ames-agent-sync-${{ github.sha }}
          path: ${{ runner.temp }}/central-ames-integrated.zip
          if-no-files-found: error
          retention-days: 7

  windows-smoke:
    needs: build-clean
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: central-ames-agent-sync-${{ github.sha }}
          path: artifact
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Extract exact uploaded CLEAN
        shell: powershell
        run: |
          $zip=(Get-ChildItem artifact -Filter '*.zip' | Select-Object -First 1).FullName
          if(-not $zip){throw 'CLEAN ZIP not found'}
          Expand-Archive -LiteralPath $zip -DestinationPath package -Force
          if(-not (Test-Path 'package\00_INICIAR_AQUI.bat')){throw '00_INICIAR_AQUI.bat missing'}
          if(-not (Test-Path 'package\INICIAR_POSTO_CENTRAL_V2.bat')){throw 'canonical web launcher missing'}
          if(-not (Test-Path 'package\FRONTEND_GATE.json')){throw 'preview gate missing'}
          if(Test-Path 'package\ames-agent\config.json'){throw 'CLEAN must not contain workstation config.json'}
          if(Test-Path 'package\ames-agent\data\ames_local.sqlite3'){throw 'CLEAN must not contain operational SQLite'}
      - name: Run real first-use installer
        shell: cmd
        working-directory: package
        run: |
          call 01_INSTALAR_UMA_VEZ.bat /auto
          if errorlevel 1 exit /b %errorlevel%
          if not exist ".venv\Scripts\python.exe" exit /b 41
          if not exist "ames-agent\config.json" exit /b 42
          if not exist "ames-agent\data\ames_local.sqlite3" exit /b 43
      - name: Launch canonical agent and smoke local UI
        shell: powershell
        run: |
          $root=(Resolve-Path 'package').Path
          $starter=(Resolve-Path 'package\suporte\ames-workstation\START_AGENT_CANONICAL.ps1').Path
          $pidToStop=$null
          try {
            & powershell -NoProfile -ExecutionPolicy Bypass -File $starter -Root $root -StartupTimeoutSeconds 60
            if($LASTEXITCODE -ne 0){throw "launcher failed: $LASTEXITCODE"}
            $ready=Invoke-RestMethod 'http://127.0.0.1:8765/api/v1/ready' -TimeoutSec 5
            if(-not $ready.ready){throw 'agent not ready'}
            $pidToStop=[int]$ready.pid
            $html=Invoke-WebRequest 'http://127.0.0.1:8765/Central-de-Controle-/' -UseBasicParsing -TimeoutSec 5
            if($html.StatusCode -ne 200 -or $html.Content -notmatch 'Central'){throw 'local frontend fallback not served'}
            $manifest=Get-Content 'package\CANDIDATE_MANIFEST.json' -Raw | ConvertFrom-Json
            if([string]$manifest.sha -ne '${{ github.sha }}'){throw "manifest SHA mismatch: $($manifest.sha)"}
            $gate=Get-Content 'package\FRONTEND_GATE.json' -Raw | ConvertFrom-Json
            if([string]$gate.expected_sha -ne '${{ github.sha }}'){throw "gate SHA mismatch: $($gate.expected_sha)"}
          }
          finally {
            if($pidToStop){Stop-Process -Id $pidToStop -Force -ErrorAction SilentlyContinue}
          }

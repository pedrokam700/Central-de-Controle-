name: Apply 3022 lifecycle fix

on:
  push:
    branches:
      - work/ames-operator-ux-parity-20261014
    paths:
      - scripts/patch-3022-lifecycle-b.py

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Apply verified lifecycle correction
        run: |
          python scripts/patch-3022-lifecycle-a.py
          python scripts/patch-3022-lifecycle-b.py
          python -m py_compile ames/factory-engine/ames/tela_3022.py
          python scripts/agent-3022-grid-lifecycle.test.py
          cat > scripts/ames-3022-grid-lifecycle.test.mjs <<'EOF'
          import test from 'node:test';
          import assert from 'node:assert/strict';
          import {spawnSync} from 'node:child_process';

          test('3022 grid/store lifecycle regression contract', () => {
            const python = process.env.PYTHON_BIN || 'python3';
            const run = spawnSync(python, ['scripts/agent-3022-grid-lifecycle.test.py'], {encoding:'utf8'});
            assert.equal(run.status, 0, `${run.stdout || ''}\n${run.stderr || ''}`);
          });
          EOF
          node --test scripts/ames-3022-grid-lifecycle.test.mjs
          git diff --check
      - name: Commit canonical source fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ames/factory-engine/ames/tela_3022.py scripts/ames-3022-grid-lifecycle.test.mjs
          git commit -m "fix(ames): follow 3022 ExtJS result lifecycle"
          git push origin HEAD:${GITHUB_REF_NAME}

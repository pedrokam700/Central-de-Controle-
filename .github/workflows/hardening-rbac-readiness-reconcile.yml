name: One-shot RBAC readiness reconciliation

on:
  push:
    branches:
      - hardening/p0-production-readiness
    paths:
      - .github/workflows/hardening-rbac-readiness-reconcile.yml

permissions:
  contents: write

jobs:
  reconcile:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact hardening head
        uses: actions/checkout@v7
        with:
          ref: hardening/p0-production-readiness
          fetch-depth: 0
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Refuse moved branch
        run: test "$(git rev-parse HEAD)" = "$GITHUB_SHA" || { echo "Branch moved; fail closed."; exit 1; }
      - name: Reconcile evidence, readiness and H2 expectation
        run: node scripts/reconcile-rbac-readiness.mjs
      - name: Validate readiness remains fail-closed
        run: |
          node --test scripts/ames-production-readiness.test.mjs
          git diff --check -- hardening/production-readiness.json hardening/session-admission-app-evidence.json hardening/admission-admin-ui-evidence.json scripts/ames-production-readiness.test.mjs
      - name: Commit reconciliation and remove one-shot machinery
        run: |
          rm .github/workflows/hardening-rbac-readiness-reconcile.yml
          rm scripts/reconcile-rbac-readiness.mjs
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add hardening/production-readiness.json hardening/session-admission-app-evidence.json hardening/admission-admin-ui-evidence.json scripts/ames-production-readiness.test.mjs .github/workflows/hardening-rbac-readiness-reconcile.yml scripts/reconcile-rbac-readiness.mjs
          git diff --cached --check
          git commit -m "Hardening: reconcile H2 and RBAC readiness evidence"
          git push origin HEAD:hardening/p0-production-readiness

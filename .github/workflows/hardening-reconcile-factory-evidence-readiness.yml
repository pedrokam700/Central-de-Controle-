name: One-shot factory evidence readiness reconciliation

on:
  push:
    branches:
      - hardening/p0-production-readiness
    paths:
      - .github/workflows/hardening-reconcile-factory-evidence-readiness.yml

permissions:
  contents: write

jobs:
  reconcile:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: hardening/p0-production-readiness
          fetch-depth: 0
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Reconcile factory evidence readiness
        run: node scripts/reconcile-factory-evidence-readiness.mjs
      - name: Validate production readiness fail-closed
        run: node --test scripts/ames-production-readiness.test.mjs
      - name: Validate physical blockers remain
        run: |
          node - <<'NODE'
          const fs=require('fs');
          const r=JSON.parse(fs.readFileSync('hardening/production-readiness.json','utf8'));
          const g=r.gates.r12_engine_consolidation;
          if(g.status!=='factory_gate_pending') throw new Error('R12 gate promoted unexpectedly');
          for(const x of ['capture real R12','compare behavior','9/9','then remove process_r11 compatibility bridge']) if(!g.remaining.includes(x)) throw new Error('missing blocker '+x);
          if(r.physical_candidate.factory_9_of_9!=='pending') throw new Error('factory 9/9 changed');
          if(r.promotion.stable_allowed||r.promotion.main_merge_allowed||r.promotion.production_rules_publish_allowed) throw new Error('promotion changed');
          NODE
      - name: Remove one-shot tooling
        run: rm scripts/reconcile-factory-evidence-readiness.mjs .github/workflows/hardening-reconcile-factory-evidence-readiness.yml
      - name: Commit validated readiness only
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m 'Hardening: reconcile factory evidence readiness'
          git push origin HEAD:hardening/p0-production-readiness

name: One-shot compound outbox app patch

on:
  push:
    branches:
      - hardening/p0-production-readiness

permissions:
  contents: write

concurrency:
  group: hardening-compound-outbox-app-patch
  cancel-in-progress: false

jobs:
  apply:
    if: github.repository == 'pedrokam700/Central-de-Controle-'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout exact hardening head
        uses: actions/checkout@v7
        with:
          ref: hardening/p0-production-readiness
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Refuse to patch a moved branch
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA" || { echo "Branch moved after workflow dispatch; fail closed."; exit 1; }

      - name: Apply exact anchored patch
        run: node scripts/apply-compound-outbox-app-patch.mjs

      - name: Parse app and run focused H2 tests
        run: |
          node --check app.js
          node --test scripts/ames-offline-domain-write.test.mjs scripts/ames-offline-outbox.test.mjs
          git diff --check -- app.js scripts/ames-offline-outbox.test.mjs

      - name: Commit patched app and remove one-shot machinery
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.js scripts/ames-offline-outbox.test.mjs
          git rm .github/workflows/hardening-compound-outbox-patch.yml scripts/apply-compound-outbox-app-patch.mjs
          git diff --cached --check
          git commit -m "Hardening: integrate atomic compound offline writes"
          git push origin HEAD:hardening/p0-production-readiness

# retry after exact generated-field count fix
name: One-shot agent workstation identity client

on:
  push:
    branches:
      - hardening/p0-production-readiness
    paths:
      - .github/workflows/hardening-agent-workstation-identity-client.yml

permissions:
  contents: write

jobs:
  patch-and-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Verify exact branch head
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin hardening/p0-production-readiness
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git rev-parse origin/hardening/p0-production-readiness)" = "$GITHUB_SHA"
      - name: Bind public hardened workstation identity into agent client
        run: node scripts/patch-agent-workstation-identity-client.mjs
      - name: Validate focused identity and compatibility contracts
        shell: bash
        run: |
          set -euo pipefail
          node --check ames/agent-client.mjs
          node --test \
            scripts/ames-agent-workstation-identity-client.test.mjs \
            scripts/ames-agent.test.mjs \
            scripts/ames-agent-pairing.test.mjs \
            scripts/ames-collector-authority.test.mjs \
            scripts/ames-publication-fence.test.mjs \
            scripts/ames-cache.test.mjs
          python scripts/agent-workstation-identity.test.py
          git diff --check
      - name: Remove one-shot write tooling
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/hardening-agent-workstation-identity-client.yml
          rm -f scripts/patch-agent-workstation-identity-client.mjs
          git diff --check
      - name: Commit only after focused validation
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin hardening/p0-production-readiness
          test "$(git rev-parse origin/hardening/p0-production-readiness)" = "$GITHUB_SHA"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && { echo "No workstation identity client changes"; exit 1; }
          git commit -m "Hardening: bind local agent workstation identity to client state"
          git push origin HEAD:hardening/p0-production-readiness

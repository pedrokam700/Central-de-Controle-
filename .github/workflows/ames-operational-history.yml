name: A-MES Operational History
on:
  push:
    branches: [work/ames-operational-history-kpis-20261019, work/ames-pr35-pr36-integration-20261019]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  reading-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Temporal scope and preserved history contracts
        run: node --test scripts/ames-failure-occurrence-evidence.test.mjs scripts/ames-observation-provenance.test.mjs scripts/ames-sn-source-provenance.test.mjs scripts/ames-production-evidence-analytics.test.mjs scripts/ames-sn-history-detail.test.mjs scripts/ames-sn-smart-alerts.test.mjs scripts/ames-sn-temporal-proof.test.mjs scripts/ames-sn-live-context.test.mjs scripts/ames-sn-material-bindings.test.mjs scripts/ames-sn-repair-evidence.test.mjs scripts/ames-cache.test.mjs scripts/ames-history-trends.test.mjs scripts/ames-reuse-cohorts.test.mjs scripts/ames-reading-period.test.mjs scripts/ames-source-capture-history.test.mjs scripts/ames-source-coverage.test.mjs scripts/ames-operational-context.test.mjs scripts/ames-history-source.test.mjs scripts/ames-offline-shell.test.mjs scripts/ames-history-revisions.test.mjs scripts/ames-period-history-matching.test.mjs scripts/ames-agent.test.mjs
      - name: Immutable SQLite revisions and historical endpoint
        run: |
          python3 scripts/agent-history-restore.test.py
          python3 scripts/agent-local-history.test.py
          python3 scripts/agent-raw-history.test.py
          python3 scripts/agent-saved-sn-history.test.py
          python3 scripts/agent-trace-target.test.py
          python3 scripts/agent-source-capture.test.py
          python3 scripts/agent-capture-manifest.test.py
          python3 scripts/agent-canonical.test.py
          python3 scripts/agent-repair-association.test.py
          python3 scripts/agent-3012-capture.test.py
          python3 scripts/agent-operational-day-selection.test.py
  reading-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Install isolated existing browser test tools
        run: |
          npm install --prefix "$RUNNER_TEMP/history-tests" playwright@1.62.1
          "$RUNNER_TEMP/history-tests/node_modules/.bin/playwright" install --with-deps chromium
      - name: Nine views read one period without MES mutations
        run: |
          export PLAYWRIGHT_MODULE="$RUNNER_TEMP/history-tests/node_modules/playwright/index.mjs"
          node scripts/ames-reading-period.browser.mjs
  reading-windows:
    runs-on: windows-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test exact-source SQLite history under isolated Windows
        shell: pwsh
        run: |
          python -m pip install --disable-pip-version-check "tzdata>=2025.2"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          foreach ($script in @(
            'scripts/agent-history-restore.test.py',
            'scripts/agent-source-capture.test.py',
            'scripts/agent-capture-manifest.test.py',
            'scripts/agent-trace-target.test.py',
            'scripts/agent-canonical.test.py',
            'scripts/agent-repair-association.test.py',
            'scripts/agent-3012-capture.test.py',
            'scripts/agent-raw-history.test.py'
          )) {
            python $script
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
  reading-firestore:
    runs-on: ubuntu-latest
    timeout-minutes: 16
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install isolated emulator tools
        run: npm install --prefix "$RUNNER_TEMP/history-firestore" firebase-tools@15.2.1 @firebase/rules-unit-testing@5.0.0 firebase@12.7.0
      - name: Verify no cross-PC release-rule regression
        shell: bash
        run: |
          export FIREBASE_TEST_MODULES="$RUNNER_TEMP/history-firestore/node_modules"
          for suite in scripts/ames-rules.emulator.mjs scripts/ames-pr38-day.emulator.mjs scripts/ames-pr40-analytics.emulator.mjs; do
            "$RUNNER_TEMP/history-firestore/node_modules/.bin/firebase" emulators:exec --only firestore --project demo-central-mes "node $suite"
          done

name: One-shot collector authority runtime wiring

on:
  push:
    branches:
      - hardening/p0-production-readiness
    paths:
      - .github/workflows/hardening-collector-authority-runtime-app.yml

permissions:
  contents: write

jobs:
  patch-and-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Verify exact branch head
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin hardening/p0-production-readiness
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git rev-parse origin/hardening/p0-production-readiness)" = "$GITHUB_SHA"
      - name: Wire observe-only collector authority runtime
        run: node scripts/patch-collector-authority-runtime-app.mjs
      - name: Validate runtime remains read-only and offline-safe
        shell: bash
        run: |
          set -euo pipefail
          node --check app.js
          node --check ames/console-monitor-runtime.mjs
          node --test \
            scripts/ames-collector-authority-runtime.test.mjs \
            scripts/ames-collector-authority-runtime-app.test.mjs \
            scripts/ames-collector-lease-observer.test.mjs \
            scripts/ames-collector-lease-client.test.mjs \
            scripts/ames-collector-lease-confirm.test.mjs \
            scripts/ames-cache.test.mjs \
            scripts/ames-release-build.test.mjs
          git diff --check
      - name: Remove one-shot write tooling
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/hardening-collector-authority-runtime-app.yml
          rm -f scripts/patch-collector-authority-runtime-app.mjs
          git diff --check
      - name: Commit only after focused validation
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin hardening/p0-production-readiness
          test "$(git rev-parse origin/hardening/p0-production-readiness)" = "$GITHUB_SHA"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && { echo "No collector runtime wiring changes"; exit 1; }
          git commit -m "Hardening: wire observe-only collector authority diagnostics"
          git push origin HEAD:hardening/p0-production-readiness

name: One-shot factory evidence SHA guard fix

on:
  push:
    branches:
      - hardening/p0-production-readiness
    paths:
      - .github/workflows/hardening-fix-factory-evidence-sha.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: hardening/p0-production-readiness
          fetch-depth: 0
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Apply exact factory evidence SHA guard patch
        run: node scripts/patch-factory-evidence-sha-guards.mjs
      - name: Validate Python syntax and focused contract
        env:
          PYTHON_BIN: python3
        run: |
          python3 -m py_compile tools/ames-workstation/factory-validation-evidence.py
          node --test scripts/ames-factory-validation-evidence.test.mjs
      - name: Remove one-shot tooling
        run: rm scripts/patch-factory-evidence-sha-guards.mjs .github/workflows/hardening-fix-factory-evidence-sha.yml
      - name: Commit validated fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m 'Hardening: fix factory evidence SHA guards'
          git push origin HEAD:hardening/p0-production-readiness

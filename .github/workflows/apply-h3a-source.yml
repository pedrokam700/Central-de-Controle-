name: Apply H3A auth source migration
on:
  push:
    branches: [v2/console-parity-r12]
    paths:
      - scripts/hardening-h3a-apply.py
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: v2/console-parity-r12
          fetch-depth: 1
      - name: Apply exact H3A migration
        run: python3 scripts/hardening-h3a-apply.py
      - name: Verify intended migration
        run: |
          git diff --check
          git diff -- app.js sw.js
          test -n "$(git status --porcelain app.js sw.js)"
      - name: Remove one-shot migrator and commit
        run: |
          rm -f scripts/hardening-h3a-apply.py .github/workflows/apply-h3a-source.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.js sw.js scripts/hardening-h3a-apply.py .github/workflows/apply-h3a-source.yml
          git commit -m "Hardening H3A: remover credenciais e privilégios legados"
          git push origin HEAD:v2/console-parity-r12

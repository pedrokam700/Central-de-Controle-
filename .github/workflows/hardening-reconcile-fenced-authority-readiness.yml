name: One-shot fenced authority readiness reconciliation

on:
  push:
    branches:
      - hardening/p0-production-readiness
    paths:
      - '.github/workflows/hardening-reconcile-fenced-authority-readiness.yml'

permissions:
  contents: write

jobs:
  reconcile:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Reconcile readiness
        run: node scripts/hardening-reconcile-fenced-authority-readiness.mjs
      - name: Validate readiness remains fail-closed
        run: |
          node -e "const x=require('./hardening/production-readiness.json');const g=x.gates.multi_collector_authority;if(!g.status.startsWith('partial_'))process.exit(1);if(x.promotion.stable_allowed||x.promotion.main_merge_allowed||x.promotion.production_rules_publish_allowed)process.exit(1);if(!g.remaining.some(v=>v.includes('physical multi-PC')))process.exit(1);if(!g.remaining.some(v=>v.includes('production Rules')))process.exit(1);"
      - name: Remove one-shot tooling
        run: rm scripts/hardening-reconcile-fenced-authority-readiness.mjs .github/workflows/hardening-reconcile-fenced-authority-readiness.yml
      - name: Commit validated readiness only
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add hardening/production-readiness.json scripts/hardening-reconcile-fenced-authority-readiness.mjs .github/workflows/hardening-reconcile-fenced-authority-readiness.yml
          git diff --cached --quiet && { echo 'No validated readiness change'; exit 1; }
          git commit -m 'Hardening: reconcile server-fenced collector authority readiness'
          git push origin HEAD:hardening/p0-production-readiness

name: One-shot runtime observer readiness

on:
  push:
    branches:
      - hardening/p0-production-readiness
    paths:
      - .github/workflows/hardening-runtime-observer-readiness.yml

permissions:
  contents: write

jobs:
  reconcile:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Verify exact branch head
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin hardening/p0-production-readiness
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git rev-parse origin/hardening/p0-production-readiness)" = "$GITHUB_SHA"
      - name: Reconcile runtime observer readiness
        run: node scripts/reconcile-runtime-observer-readiness.mjs
      - name: Validate runtime observer evidence
        shell: bash
        run: |
          set -euo pipefail
          node --test \
            scripts/ames-collector-authority-runtime.test.mjs \
            scripts/ames-collector-authority-runtime-app.test.mjs \
            scripts/ames-collector-lease-confirm.test.mjs
          node -e "const x=require('./hardening/production-readiness.json');const g=x.gates.multi_collector_authority;if(g.status!=='partial_runtime_observer_green_confirm_wiring_pending_enforcement_off'||!g.full_ci_runs.includes(38187026029)||!g.remaining.some(x=>x.includes('invoke confirmOwned only for same-workstation')))process.exit(1)"
          git diff --check
      - name: Remove one-shot tooling
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/hardening-runtime-observer-readiness.yml
          rm -f scripts/reconcile-runtime-observer-readiness.mjs
          git diff --check
      - name: Commit only after validation
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin hardening/p0-production-readiness
          test "$(git rev-parse origin/hardening/p0-production-readiness)" = "$GITHUB_SHA"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && { echo "No runtime observer readiness changes"; exit 1; }
          git commit -m "Hardening: reconcile runtime collector observer GREEN"
          git push origin HEAD:hardening/p0-production-readiness

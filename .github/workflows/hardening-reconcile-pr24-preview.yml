name: One-shot PR24 preview readiness reconciliation

on:
  push:
    branches:
      - hardening/p0-production-readiness
    paths:
      - .github/workflows/hardening-reconcile-pr24-preview.yml

permissions:
  contents: write

jobs:
  reconcile:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: hardening/p0-production-readiness
          fetch-depth: 0
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Reconcile PR24 external preview blocker
        run: node scripts/reconcile-pr24-preview-readiness.mjs
      - name: Validate production readiness fail-closed
        run: node --test scripts/ames-production-readiness.test.mjs
      - name: Validate no promotion or smoke weakening
        run: |
          node - <<'NODE'
          const fs=require('fs');
          const r=JSON.parse(fs.readFileSync('hardening/production-readiness.json','utf8'));
          const e=JSON.parse(fs.readFileSync('hardening/published-preview-smoke-evidence.json','utf8'));
          if(r.promotion.stable_allowed||r.promotion.main_merge_allowed||r.promotion.production_rules_publish_allowed) throw new Error('promotion flag changed');
          if(r.gates.published_preview_smoke.status==='green') throw new Error('preview smoke cannot be green');
          if(!String(r.gates.published_preview_smoke.blocker||'').includes('Netlify')) throw new Error('Netlify blocker missing');
          if(!String(r.gates.published_preview_smoke.blocker||'').includes('central-cora-v2')) throw new Error('Vercel project blocker missing');
          if(e.workflow_run!==38244959294||e.pull_request!==24) throw new Error('preview evidence identity mismatch');
          if(!e.not_proven.includes('published preview exact-SHA smoke GREEN')) throw new Error('not-proven guard missing');
          NODE
      - name: Remove one-shot tooling
        run: rm scripts/reconcile-pr24-preview-readiness.mjs .github/workflows/hardening-reconcile-pr24-preview.yml
      - name: Commit validated readiness only
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m 'Hardening: record PR24 external preview blocker'
          git push origin HEAD:hardening/p0-production-readiness

name: Temporary quality gate diagnostic

on:
  push:
    branches:
      - hardening/p0-production-readiness
    paths:
      - .github/workflows/hardening-quality-gate-diagnostic.yml

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Install test-only Python dependency
        run: python3 -m pip install openpyxl==3.1.5
      - name: Run exact quality gate and capture output
        id: quality
        shell: bash
        run: |
          set +e
          PYTHON_BIN=python3 node scripts/quality-gate.mjs > quality-gate-output.txt 2>&1
          code=$?
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Upload diagnostic output
        uses: actions/upload-artifact@v6
        with:
          name: quality-gate-diagnostic-${{ github.sha }}
          path: quality-gate-output.txt
          if-no-files-found: error
          retention-days: 1
      - name: Preserve original result
        shell: bash
        run: exit "${{ steps.quality.outputs.exit_code }}"

name: A-MES synthetic LAB isolation and D01 D02 recovery (no distribution)
on:
  push:
    branches:
      - work/ames-lab-entry-p01-p03-p06-20261117
permissions:
  contents: read
jobs:
  linux-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        shell: bash ./scripts/audit/guarded-ci.sh {0}
    env:
      PYTHONPATH: '${{ github.workspace }}/scripts/audit/no_distribution'
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Explicit LAB isolation and persistence
        run: python3 -B scripts/agent-lab-isolation.test.py -v
      - name: Guard class compatibility and refusal before launcher
        run: python3 -B scripts/agent-distribution-guard-compat.test.py -v
      - name: Disposable D01 D02 I/O and interruption matrix
        run: python3 -B scripts/agent-updater-recovery.test.py -v
      - name: Static safe contracts and dependency closure (no builder)
        run: |
          python3 -B scripts/audit/offline-homologation-static.test.py -v
          python3 -B scripts/agent-integration-migration-static.test.py -v
      - name: Existing update hardening recovery identity contracts (disposable)
        run: |
          python3 -B scripts/agent-update.test.py
          python3 -B scripts/agent-hardening.test.py
          python3 -B scripts/agent-update-readiness.test.py
          python3 -B scripts/agent-performance-indexes.test.py
          python3 -B scripts/agent-operational-calendar.test.py
      - name: Node updater identity offline and preload contracts
        run: node --test scripts/ames-candidate-preview.test.mjs scripts/ames-workstation-update-policy.test.mjs scripts/ames-integration-worker.test.mjs scripts/ames-distribution-preload.test.mjs scripts/ames-distribution-workflow.test.mjs
  windows-proof:
    runs-on: windows-latest
    timeout-minutes: 10
    env:
      PYTHONPATH: '${{ github.workspace }}/scripts/audit/no_distribution'
      # Preserve frozen collector bytes in the disposable checkout, no global config.
      GIT_CONFIG_COUNT: '1'
      GIT_CONFIG_KEY_0: core.autocrlf
      GIT_CONFIG_VALUE_0: 'false'
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      # Inline CI shell only. No workstation PowerShell/startup/guardian scripts.
      # Use preinstalled Python; no setup, install, browser download or package.
      - name: Disposable Windows Python I/O and interruption matrix
        shell: pwsh
        run: |
          python -B scripts/agent-lab-isolation.test.py -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -B scripts/agent-distribution-guard-compat.test.py -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -B scripts/agent-updater-recovery.test.py -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -B scripts/audit/offline-homologation-static.test.py -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

  node-integrated:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        shell: bash ./scripts/audit/guarded-ci.sh {0}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Full existing Node contracts without builders or installation
        run: >-
          node --test --test-isolation=none $(find scripts -maxdepth 1 -type f -name 'ames-*.test.mjs' ! -name 'ames-auth-hardening.test.mjs' ! -name 'ames-agent-pairing.test.mjs' ! -name 'ames-r12-migration-bundle.test.mjs' ! -name 'ames-r12-capture.test.mjs' ! -name 'ames-offline-shell.test.mjs' ! -name 'ames-release-build.test.mjs' ! -name 'ames-deploy-routing.test.mjs' ! -name 'ames-stage-vercel.test.mjs' | sort)
      - name: Pairing authentication and independent cross-view identities
        run: |
          node --test scripts/ames-auth-hardening.test.mjs scripts/ames-agent-pairing.test.mjs
          node --test --test-name-pattern='U1|N1|N2|N3|S1' scripts/audit/codex_cross_contracts_red.mjs
